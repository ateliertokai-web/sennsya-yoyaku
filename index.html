<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="洗車予約">
<meta name="theme-color" content="#f5f4f1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>洗車予約</title>
<style>
:root{--ink:#1d1d1f;--sub:#6e6e73;--mute:#a1a1a6;--line:#e9e8e5;--bg:#f5f4f1;--card:#fff;--soft:#f2f1ee;--ok:#2f8f63;--few:#e0891c;--red:#c4412d;--r:12px;--rl:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;letter-spacing:.02em;-webkit-font-smoothing:antialiased}
body.hasbar .app{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.app{max-width:480px;margin:0 auto;min-height:100vh}
button{font:inherit;color:inherit;letter-spacing:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}

/* ヘッダー */
.top{display:flex;align-items:center;gap:12px;padding:calc(22px + env(safe-area-inset-top)) 24px 6px}
.top::before{content:"";flex:none;width:6px;height:28px;border-radius:3px;background:linear-gradient(#d6b46a,#a8853d)}
.top h1{margin:0;font-size:16px;line-height:1.35;font-weight:600;letter-spacing:.12em}
.top p{margin:0;font-size:11.5px;line-height:1.5;color:var(--sub);letter-spacing:.06em}

/* 進行バー(押すと前の工程に戻れる) */
.prog{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:14px 20px 0}
.prog button{display:flex;flex-direction:column;gap:7px;min-height:44px;padding:4px 0;border:0;background:none;text-align:left;color:var(--mute);font-size:11.5px;font-weight:600;letter-spacing:.04em}
.prog i{height:3px;border-radius:2px;background:#e1dfda;transition:background .25s}
.prog span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.prog em{display:grid;place-items:center;flex:none;width:17px;height:17px;border-radius:50%;box-shadow:inset 0 0 0 1.5px currentColor;font-style:normal;font-size:10px;font-variant-numeric:tabular-nums}
.prog .cur{color:var(--ink)}
.prog .cur i,.prog .done i{background:var(--ink)}
.prog .cur em{background:var(--ink);color:#fff;box-shadow:none}
.prog .done{color:var(--ink);cursor:pointer}
.prog .done em{background:#d6b46a;color:#fff;box-shadow:none;font-size:0}
.prog .done em::before{content:"";width:7px;height:4px;margin-top:-2px;border:solid #fff;border-width:0 0 1.6px 1.6px;transform:rotate(-45deg)}
.prog .done span{text-decoration:underline;text-decoration-color:#cfcdc7;text-underline-offset:3px}
@media (hover:hover){.prog .done:hover span{text-decoration-color:var(--ink)}}
.prog button:disabled{cursor:default}

.view{padding:18px 20px 48px}
h2{margin:0 0 6px;font-size:23px;line-height:1.45;font-weight:600;letter-spacing:.04em}
h3{margin:28px 4px 10px;font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.1em}
.lead{margin:0 0 22px;color:var(--sub);font-size:14px;line-height:1.8}
.back{display:inline-flex;align-items:center;gap:4px;min-height:40px;margin:-2px 0 14px;padding:0 16px 0 10px;border:0;border-radius:99px;background:var(--card);box-shadow:0 0 0 1px var(--line),0 1px 3px rgba(0,0,0,.05);color:var(--ink);font-size:13.5px;font-weight:600}
.back svg{flex:none}
.back:hover{box-shadow:0 0 0 1.5px var(--ink)}
.back:active{transform:scale(.97)}
.card{background:var(--card);border-radius:var(--rl);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.03)}

/* ボタン */
.cta{display:block;width:100%;min-height:54px;padding:0 22px;border:0;border-radius:99px;background:var(--ink);color:#fff;font-size:15.5px;font-weight:600;letter-spacing:.1em;transition:opacity .15s,transform .1s}
.cta:active{transform:scale(.985)}
.cta:disabled{background:#d6d5d1;color:#fff;cursor:default;transform:none}
.ghost{display:block;width:100%;min-height:52px;padding:0 20px;border:0;border-radius:99px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-weight:600}
.danger{min-height:40px;padding:0 16px;border:0;border-radius:99px;background:#fbefec;color:var(--red);font-size:13.5px;font-weight:600}
.list{margin-top:16px;padding:0 4px 0 18px;background:var(--card);border-radius:var(--rl);box-shadow:0 0 0 1px var(--line)}
.rowbtn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:58px;padding:0 10px 0 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:15px;font-weight:500}
.rowbtn:last-child{border-bottom:0}
.rowbtn svg{flex:none;color:var(--mute)}

/* フォーム */
.form .fields{padding:6px 18px 20px}
label{display:block;margin:18px 2px 7px;font-size:12.5px;font-weight:600;color:var(--sub);letter-spacing:.06em}
input{width:100%;height:50px;padding:0 15px;border:0;border-radius:var(--r);background:var(--soft);color:var(--ink);font:inherit;letter-spacing:.02em;transition:box-shadow .15s,background .15s}
input::placeholder{color:#b4b3ae}
input:focus{background:#fff;box-shadow:0 0 0 1.5px var(--ink);outline:none}
.note{margin:12px 2px 0;font-size:12.5px;line-height:1.75;color:var(--sub)}
.form .cta{margin-top:24px}
#lRes{margin-top:8px}

/* 登録済みのお車 */
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px}
.sec:first-of-type{margin-top:6px}
.link{min-height:32px;padding:0 4px;border:0;background:none;color:var(--sub);font-size:12.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.cars{display:flex;flex-direction:column;gap:8px}
.car-it{display:flex;align-items:center;gap:8px}
.carbtn{flex:1;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;padding:10px 16px 10px 18px;border:0;border-radius:var(--rl);background:var(--card);box-shadow:0 0 0 1px var(--line);text-align:left;transition:box-shadow .15s,background .15s}
.carbtn .ci{display:flex;flex-direction:column;min-width:0}
.carbtn b{font-size:15.5px;font-weight:600;letter-spacing:.04em;line-height:1.45}
.carbtn small{font-size:12px;color:var(--sub);line-height:1.5}
.carbtn .rd{flex:none;width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #cfcdc7;transition:box-shadow .15s}
.carbtn.on{box-shadow:0 0 0 1.5px var(--ink)}
.carbtn.on .rd{box-shadow:inset 0 0 0 6px var(--ink)}
.carbtn.add{min-height:52px}
.carbtn.add b{font-size:14px;color:var(--sub)}
.carbtn.add.on b{color:var(--ink)}
.cardel{flex:none;min-height:40px;padding:0 14px;border:0;border-radius:99px;background:#fbefec;color:var(--red);font-size:12.5px;font-weight:600}
#carForm{margin-top:8px}
.contact-sum{display:flex;flex-direction:column;padding:14px 18px}
.contact-sum b{font-size:15px;font-weight:600}
.contact-sum span{font-size:12.5px;color:var(--sub);overflow-wrap:anywhere}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 8px}
.pchips button{min-height:32px;padding:0 12px;border:0;border-radius:99px;background:var(--soft);font-size:12.5px;font-weight:600}

/* 下に固定する「予約する」 */
.homebar .bar-in .cta{flex:1;width:100%;min-height:56px;font-size:16px;letter-spacing:.12em}
.textlink{display:block;margin:26px auto 0;padding:10px 14px;border:0;background:none;color:var(--sub);font-size:13.5px;font-weight:600;text-decoration:underline;text-decoration-color:#cfcdc7;text-underline-offset:4px}
.textlink:hover{color:var(--ink);text-decoration-color:var(--ink)}

/* 洗車システムについて(下から出るパネル) */
.about-bg{position:fixed;inset:0;z-index:20;background:rgba(20,20,22,.4);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.about{position:fixed;left:0;right:0;bottom:0;z-index:21;display:flex;flex-direction:column;max-width:480px;max-height:88vh;margin:0 auto;border-radius:22px 22px 0 0;background:var(--bg);box-shadow:0 -10px 40px rgba(0,0,0,.14)}
.about::before{content:"";display:block;flex:none;width:36px;height:4px;margin:8px auto 0;border-radius:2px;background:#d6d4cf}
.about-head{display:flex;align-items:center;justify-content:space-between;flex:none;padding:8px 12px 8px 22px}
.about-head h3{margin:0;font-size:16px;font-weight:600;color:var(--ink);letter-spacing:.06em}
.about-x{width:40px;height:40px;border:0;border-radius:50%;background:none;color:var(--sub);font-size:22px;line-height:1}
.about-x:hover{background:var(--soft)}
.about-body{overflow:auto;overscroll-behavior:contain;padding:4px 20px calc(24px + env(safe-area-inset-bottom))}
.about-body h4{margin:22px 4px 8px;font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.1em}
.about-body .rules{margin:0}
.notice{display:flex;gap:10px;align-items:flex-start;margin:4px 0 0;padding:14px 16px;border-radius:14px;background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;line-height:1.7}
.notice::before{content:"";flex:none;width:4px;align-self:stretch;border-radius:2px;background:#d6b46a}
.pts{margin:0;padding:6px 20px;list-style:none;background:var(--card);border-radius:var(--rl);box-shadow:0 0 0 1px var(--line)}
.pts li{position:relative;padding:11px 0 11px 16px;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.75}
.pts li:last-child{border-bottom:0}
.pts li::before{content:"";position:absolute;left:0;top:20px;width:6px;height:6px;border-radius:50%;background:#d6b46a}
.pts b{font-weight:600}
.now{display:block;margin-bottom:2px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.inst{display:flex;gap:14px;align-items:center;padding:14px 16px;background:var(--card);border-radius:var(--rl);box-shadow:0 0 0 1px var(--line)}
.inst img{flex:none;width:44px;height:44px;border-radius:11px}
.inst div{font-size:12.5px;line-height:1.7;color:var(--sub)}
.inst div b{display:block;font-size:13.5px;color:var(--ink)}
.steps{margin:10px 0 0;padding:6px 20px 6px 40px;background:var(--card);border-radius:var(--rl);box-shadow:0 0 0 1px var(--line);font-size:13.5px;line-height:1.75}
.steps li{padding:6px 0}
.steps .os{display:block;margin:10px 0 2px -20px;font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.06em;list-style:none}
.steps .os:first-child{margin-top:4px}
.inst-go{display:block;width:100%;min-height:48px;margin-top:10px;border:0;border-radius:99px;background:var(--ink);color:#fff;font-weight:600;letter-spacing:.06em}
@media (prefers-reduced-motion:no-preference){.about{animation:up .24s cubic-bezier(.2,.8,.2,1)}}

/* 車種のタイル */
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60px;padding:6px 4px;border:0;border-radius:14px;background:var(--soft);color:var(--ink);transition:background .18s,color .18s,transform .12s,box-shadow .18s}
.mt b{font-size:16px;font-weight:600;letter-spacing:.08em;line-height:1.3}
.mt small{margin-top:1px;font-size:10px;font-weight:600;color:var(--mute);letter-spacing:.1em;line-height:1.3;transition:color .18s}
.mt.wide{grid-column:span 2}
.mt.wide b{font-size:13.5px;letter-spacing:.04em}
.mt:active{transform:scale(.95)}
@media (hover:hover){.mt:not(.on):hover{background:#e9e7e2}}
.mt.on{background:var(--ink);color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.14)}
.mt.on small{color:#d6b46a}
.mt.on::after{content:"";position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;background:#d6b46a}
@media (max-width:340px){.mgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* ルール一覧 */
.rules{margin:16px 0 0;padding:6px 20px;background:var(--card);border-radius:var(--rl);box-shadow:0 0 0 1px var(--line)}
.rules:empty{display:none}
.rules div{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.7}
.rules div:last-child{border-bottom:0}
.rules dt{flex:none;width:5.5em;color:var(--sub)}
.rules dd{margin:0}

/* ご予約中 */
.mine:empty{display:none}
.mine{margin:0 0 28px;padding:16px 20px 14px;background:var(--ink);color:#fff;border-radius:var(--rl)}
.mine h3{margin:0 0 4px!important;color:#d6b46a}
.mine .note{color:#a5a5aa;margin-top:10px}
.res{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.res:last-of-type{border-bottom:0}
.res .dt{font-size:16.5px;font-weight:600;font-variant-numeric:tabular-nums}
.res .sub{font-size:12.5px;color:#a5a5aa}
.res .no{font-size:12px;color:#a5a5aa;text-align:right;white-space:nowrap;padding-top:3px}

/* カレンダー */
.car{display:inline-flex;align-items:center;gap:6px;margin:4px 0 18px;padding:5px 13px;border-radius:99px;background:var(--card);box-shadow:0 0 0 1px var(--line);font-size:12.5px;color:var(--sub)}
.calcard{padding:14px 12px 16px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px}
.mnav b{font-size:16px;font-weight:600;letter-spacing:.06em}
.mnav button{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;background:none;font-size:22px;line-height:1;color:var(--ink)}
.mnav button:hover:not(:disabled){background:var(--soft)}
.mnav button:disabled{opacity:.2;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.cal .wd{padding:2px 0 8px;text-align:center;font-size:11px;color:var(--mute);letter-spacing:.06em}
.cal .wd.sun{color:#c0503c}.cal .wd.sat{color:#4a72b0}
.d{display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0 6px;border:0;background:none}
.d .n{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;transition:background .15s,color .15s}
.d small{display:block;width:5px;height:5px;border-radius:50%;font-size:0;line-height:0;overflow:hidden}
.d.free small{background:var(--ok)}
.d.few small{background:var(--few)}
.d.full .n{color:#b9b8b3;font-weight:500}
.d.full small{background:#cfcec9}
.d.out .n,.d.closed .n{color:#d3d2cd;font-weight:400}
.d:disabled{cursor:default}
@media (hover:hover){.d:not(:disabled):hover .n{background:var(--soft)}}
.d.sel .n,.d.sel:hover .n{background:var(--ink);color:#fff}
.loading .d .n{color:#dcdbd6;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.blocked .d .n{color:#cfcec9!important;background:none!important}
.blocked .d small{background:#dcdbd6!important}
.cwarn{display:flex;gap:10px;margin:0 0 12px;padding:12px 14px;border-radius:14px;background:#fdf1dd;color:#7a4a00;font-size:12.5px;line-height:1.7}
.cwarn::before{content:"!";flex:none;display:grid;place-items:center;width:18px;height:18px;margin-top:2px;border-radius:50%;background:#e0891c;color:#fff;font-size:11px;font-weight:700}
.cwarn b{display:block;font-size:13.5px}
.wbtn{display:flex;align-items:center;width:max-content;margin-top:8px;min-height:34px;padding:0 14px;border:0;border-radius:99px;background:#7a4a00;color:#fff;font-size:12.5px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 20px;margin:12px 0 0;padding:14px 0 0;border-top:1px solid var(--line);font-size:12px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:6px;height:6px;border-radius:50%}

/* 時間 */
.tl{position:sticky;top:0;z-index:3;margin:0 -20px 4px;padding:12px 20px 14px;background:rgba(245,244,241,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tl-card{padding:14px 16px 12px;border-radius:var(--rl);background:var(--ink);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.tl-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.tl-head b{font-size:22px;font-weight:600;letter-spacing:.06em;font-variant-numeric:tabular-nums;line-height:1.2}
.tl-head b.ph{font-size:13px;font-weight:500;color:#a5a5aa;letter-spacing:.04em}
.tl-head span{font-size:11.5px;color:#d6b46a;letter-spacing:.1em;white-space:nowrap}
.trackwrap{padding:10px 0;margin:-10px 0;cursor:pointer;touch-action:pan-y;-webkit-user-select:none;user-select:none;outline:none}
.trackwrap:focus-visible .track{box-shadow:0 0 0 2px #d6b46a}
.track{position:relative;height:12px;border-radius:6px;background:rgba(255,255,255,.08)}
.track .av{position:absolute;top:0;bottom:0;border-radius:6px;background:rgba(255,255,255,.2)}
.track .pick{position:absolute;top:-3px;bottom:-3px;border-radius:7px;background:linear-gradient(90deg,#e2c27d,#b8954a);box-shadow:0 0 0 2px var(--ink),0 0 14px rgba(214,180,106,.55);transition:left .3s cubic-bezier(.2,.8,.2,1),width .3s cubic-bezier(.2,.8,.2,1),opacity .2s}
.track .pick::after{content:"";position:absolute;top:50%;left:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .15s}
.trackwrap.drag .pick{transition:left .12s ease-out,width .12s ease-out}
.trackwrap.drag .pick::after{transform:scale(1.25)}
.ticks{position:relative;height:16px;margin-top:6px;font-size:10px;color:#8e8e93;font-variant-numeric:tabular-nums}
.ticks i{position:absolute;top:0;font-style:normal;transform:translateX(-50%)}
.ticks i:first-child{transform:none}
.grp{display:flex;align-items:center;gap:10px;margin:22px 4px 10px}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.grp small{font-weight:500;color:var(--mute);letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:64px;padding:6px 0;border:0;border-radius:14px;background:var(--card);box-shadow:0 0 0 1px var(--line);font-variant-numeric:tabular-nums;transition:background .2s,color .2s,box-shadow .2s,transform .15s}
.slot b{font-size:18px;font-weight:600;letter-spacing:.04em;line-height:1.3}
.slot small{font-size:11px;color:var(--mute);letter-spacing:.04em;line-height:1.4;transition:color .2s}
.slot:active{transform:scale(.96)}
@media (hover:hover){.slot:hover{box-shadow:0 0 0 1.5px var(--ink)}}
.slot.on{background:var(--ink);color:#fff;box-shadow:0 0 0 1.5px var(--ink),0 6px 16px rgba(0,0,0,.14)}
.slot.on small{color:#d6b46a}
.slot.on::after{content:"";position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;background:#d6b46a}
.empty{padding:28px 4px;color:var(--sub);font-size:14px}

/* 下に固定するバー */
.bar-fixed{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.88);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);box-shadow:0 -1px 0 var(--line)}
.bar-in{max-width:448px;margin:0 auto;display:flex;align-items:center;gap:14px}
.sum{flex:1;min-width:0}
.sum b{display:block;font-size:15.5px;font-variant-numeric:tabular-nums;line-height:1.4}
.sum span{display:block;font-size:11.5px;color:var(--sub);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-in .cta{width:auto;flex:none;min-width:128px;min-height:50px;padding:0 20px;font-size:14.5px;letter-spacing:.06em}
@media (prefers-reduced-motion:no-preference){.bar-fixed{animation:up .22s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(100%)}}}

/* キャンセル待ち */
.segs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:#eae8e3}
.seg{min-height:42px;border:0;border-radius:10px;background:none;color:var(--sub);font-weight:600;font-size:14px;transition:background .15s,color .15s}
.seg.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 18px;border:0;border-radius:99px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-weight:600;font-size:14px;transition:background .15s,color .15s}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
.wds{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wds .chip{padding:0;border-radius:50%;aspect-ratio:1;min-height:0}

/* 完了 */
.done{padding:20px 0 4px;text-align:center}
.tick{width:56px;height:56px;margin:0 auto 18px;border-radius:50%;background:var(--ink);color:#d6b46a;display:grid;place-items:center}
.noL{margin:20px 0 0;font-size:11.5px;color:var(--sub);letter-spacing:.14em}
.noV{font-size:42px;font-weight:600;letter-spacing:.16em;font-variant-numeric:tabular-nums;line-height:1.3}
.facts{margin:22px 0 22px;padding:4px 20px;background:var(--card);border-radius:var(--rl);box-shadow:0 0 0 1px var(--line)}
.facts div{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.facts div:last-child{border-bottom:0}
.facts dt{color:var(--sub);font-size:13.5px}.facts dd{margin:0;font-weight:600;text-align:right}
.item{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;margin:0 0 10px;padding:16px 16px 16px 20px;background:var(--card);border-radius:var(--rl);box-shadow:0 0 0 1px var(--line)}
.item .t{font-weight:600}
.item .s{grid-column:1;font-size:12.5px;color:var(--sub)}
.item .danger{grid-column:2;grid-row:1/span 2}
.err{color:var(--red)}

/* 通知 */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,8px);z-index:30;width:max-content;max-width:calc(100% - 32px);padding:12px 20px;border-radius:14px;background:rgba(29,29,31,.94);color:#fff;font-size:13.5px;line-height:1.6;box-shadow:0 8px 30px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.err{background:var(--red)}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.hasbar .toast{bottom:calc(100px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><h1 id="shop">洗車予約</h1><p id="subline"></p></div></header>
<nav class="prog" id="prog" hidden aria-label="予約の手順">
  <button data-step="1"><i></i><span><em>1</em>お車の情報</span></button>
  <button data-step="2"><i></i><span><em>2</em>日にち</span></button>
  <button data-step="3"><i></i><span><em>3</em>時間</span></button>
</nav>

<main>
<!-- ホーム -->
<section id="home" class="view">
  <div id="mine" class="mine"></div>
  <h2 id="homeTitle"></h2>
  <p class="lead" id="homeLead"></p>
  <div class="list">
    <button class="rowbtn" id="goLookup"><span>予約の確認・キャンセル</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <button class="textlink" id="aboutBtn" aria-haspopup="dialog">洗車システムについて</button>
</section>

<!-- お車の情報 -->
<section id="info" class="view form" hidden>
  <button class="back" data-go="home"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>もどる</button>
  <h2>お車の情報</h2>
  <div id="garage" hidden>
    <h3 class="sec">お車を選ぶ<button type="button" class="link" id="carEdit">編集</button></h3>
    <div class="cars" id="carList" role="radiogroup" aria-label="登録済みのお車"></div>
  </div>
  <div class="card fields" id="carForm">
  <label id="fModelLbl">車種</label>
  <div class="mgrid" id="fModel" role="radiogroup" aria-labelledby="fModelLbl"></div>
  <label for="fPlate">車両ナンバー</label>
  <input type="text" id="fPlate" placeholder="鹿児島 330 あ 12-34" autocomplete="off">
  </div>
  <p class="note" id="durNote" hidden></p>
  <h3 class="sec">ご連絡先<button type="button" class="link" id="contactEdit" hidden>変更</button></h3>
  <div class="card contact-sum" id="contactSum" hidden></div>
  <div class="card fields" id="contactForm">
  <label for="fName">お名前</label>
  <input type="text" id="fName" autocomplete="name">
  <label for="fPhone">電話番号</label>
  <input type="tel" id="fPhone" autocomplete="tel">
  <label for="fMail">メールアドレス</label>
  <input type="email" id="fMail" autocomplete="email">
  </div>
  <p class="note" id="infoNote" hidden></p>
  <button class="cta" id="infoNext">日にちを選ぶ</button>
</section>

<!-- 日にち -->
<section id="cal" class="view" hidden>
  <button class="back" id="calBack"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>お車の情報</button>
  <h2>日にちを選ぶ</h2>
  <span class="car" id="calNote"></span>
  <div class="cwarn" id="calWarn" hidden></div>
  <div class="card calcard">
  <div class="mnav"><button id="calPrev" aria-label="前の月">‹</button><b id="calLabel"></b><button id="calNext" aria-label="次の月">›</button></div>
  <div id="calBody"></div>
  <div class="legend">
    <span><i style="background:var(--ok)"></i>空きあり</span>
    <span><i style="background:var(--few)"></i>残りわずか</span>
    <span><i style="background:#cfcec9"></i>満席</span>
  </div>
  </div>
  <div class="list"><button class="rowbtn" id="calWait"><span>満席の日をキャンセル待ちする</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></div>
</section>

<!-- 時間 -->
<section id="slots" class="view" hidden>
  <button class="back" id="slotBack"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>日にち</button>
  <h2 id="slotTitle"></h2>
  <p class="lead" id="slotSub"></p>
  <div id="slotList"></div>
</section>

<!-- 完了 -->
<section id="done" class="view" hidden>
  <div class="done">
    <div class="tick"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2 id="doneTitle">予約が完了しました</h2>
    <p class="noL">予約番号</p>
    <div class="noV" id="doneNo"></div>
  </div>
  <dl class="facts" id="doneFacts"></dl>
  <p class="note" id="doneNote" style="margin:0 4px 24px" hidden></p>
  <button class="cta" data-go="home">トップへ</button>
</section>

<!-- 確認・キャンセル -->
<section id="lookup" class="view form" hidden>
  <button class="back" data-go="home"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>もどる</button>
  <h2>予約の確認・キャンセル</h2>
  <div class="card fields">
  <label for="lMail">メールアドレス</label>
  <input type="email" id="lMail">
  <label for="lPlate">車両ナンバー</label>
  <div class="pchips" id="lCars" hidden></div>
  <input type="text" id="lPlate" placeholder="鹿児島 330 あ 12-34">
  </div>
  <button class="cta" id="lGo">確認する</button>
  <div id="lRes"></div>
</section>

<!-- キャンセル待ち -->
<section id="wait" class="view" hidden>
  <button class="back" data-go="home"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>もどる</button>
  <h2>キャンセル待ち</h2>
  <p class="lead" id="waitLead" hidden></p>
  <h3>対象の選び方</h3>
  <div class="segs" id="wMode"></div>
  <div id="wMonthsBox"><h3>月</h3><div class="chips" id="wMonths"></div></div>
  <div id="wWdBox" hidden><h3>曜日</h3><div class="wds" id="wWd"></div></div>
  <div id="wDatesBox" hidden>
    <h3>日にち(複数選べます)</h3>
    <div class="card calcard">
    <div class="mnav"><button id="wPrev" aria-label="前の月">‹</button><b id="wLabel"></b><button id="wNext" aria-label="次の月">›</button></div>
    <div id="wCal"></div>
    </div>
  </div>
</section>

<!-- 空き案内メールからの確定 -->
<section id="hold" class="view" hidden>
  <h2>空きが出ました</h2>
  <div id="holdBody"><p class="lead">読み込み中…</p></div>
</section>
</main>
</div>

<div class="bar-fixed homebar" id="homeBar" hidden><div class="bar-in"><button class="cta" id="goReserve">予約する</button></div></div>
<div class="about-bg" id="aboutBg" hidden></div>
<div class="about" id="about" role="dialog" aria-modal="true" aria-labelledby="aboutTitle" hidden>
  <div class="about-head"><h3 id="aboutTitle">洗車システムについて</h3><button class="about-x" id="aboutX" aria-label="閉じる">×</button></div>
  <div class="about-body" id="aboutBody"></div>
</div>
<div class="bar-fixed" id="bar" hidden><div class="bar-in"><div class="sum"><b id="barMain"></b><span id="barSub"></span></div><button class="cta" id="barBtn"></button></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* GASのウェブアプリURL */
const API = 'https://script.google.com/macros/s/AKfycbzHj9e15-2k4kkNa63ctM0P2KBXVbKfzGJGvhBNKXl0Er2u5_75qR7Kmev8Z0TzTdcg/exec';

const $ = id => document.getElementById(id);
const WD = ['日','月','火','水','木','金','土'];
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const dJa = d => { const a = d.split('-'); return (+a[1]) + '月' + (+a[2]) + '日(' + WD[new Date(+a[0], a[1]-1, +a[2]).getDay()] + ')'; };
const ymJa = ym => { const a = ym.split('-'); return a[0] + '年' + (+a[1]) + '月'; };
const dShort = d => { const a = d.split('-'); return (+a[1]) + '/' + (+a[2]) + '(' + WD[new Date(+a[0], a[1]-1, +a[2]).getDay()] + ')'; };

async function api(action, data) {
  let r;
  try {
    r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action }, action === 'config' ? { site: location.origin + location.pathname } : {}, data || {})) });
  } catch (e) { throw new Error('通信できませんでした。電波の良い場所で、もう一度お試しください。'); }
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
let tt;
function toast(msg, isErr) {
  const t = $('toast'); t.textContent = msg; t.classList.toggle('err', !!isErr); t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), isErr ? 5200 : 2600);
}
function busy(btn, fn) {
  return async () => { btn.disabled = true; try { await fn(); } catch (e) { toast(e.message, true); } finally { btn.disabled = false; } };
}
const STEPS = { info: 1, cal: 2, slots: 3 };
function show(id) {
  document.querySelectorAll('.view').forEach(v => v.hidden = v.id !== id);
  const p = STEPS[id]; $('prog').hidden = !p;
  if (p) document.querySelectorAll('#prog button').forEach(b => {
    const n = +b.dataset.step;
    b.classList.toggle('done', n < p); b.classList.toggle('cur', n === p); b.disabled = n >= p;
    if (n === p) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
  });
  setBar(null); window.scrollTo(0, 0);
  // ホームでは「予約する」を画面の下に固定(指が届きやすい位置)
  const home = id === 'home' && !!cfg;
  $('homeBar').hidden = !home; if (home) document.body.classList.add('hasbar');
}
/* 進行バーを押すと、その工程に戻る */
document.querySelectorAll('#prog button').forEach(b => b.onclick = () => {
  const n = +b.dataset.step;
  if (n === 1) goInfo(afterInfo); else if (n === 2) openCal();
});
function setBar(o) {
  const b = $('bar');
  if (!o) { b.hidden = true; document.body.classList.remove('hasbar'); return; }
  $('barMain').textContent = o.main; $('barSub').textContent = o.sub || '';
  const btn = $('barBtn'); btn.textContent = o.label; btn.disabled = !!o.disabled; btn.onclick = busy(btn, o.fn);
  b.hidden = false; document.body.classList.add('hasbar');
}

let cfg, profile = load('wash_profile', {}), mine = load('wash_mine', []);
/* この端末に登録したお車(複数台) */
let cars = load('wash_cars', []);
if (!cars.length && profile.plate && profile.model) { cars = [{ model: profile.model, plate: profile.plate }]; save('wash_cars', cars); }
let large = false, curYm = null, monthCache = {}, pick = null;
/* ナンバーの比較用(空白・ハイフンなどを無視) */
const np = v => String(v || '').replace(/[\s\-‐ー－・]/g, '').toLowerCase();

function months() {
  const out = [], a = cfg.min.split('-').map(Number), b = cfg.max.split('-').map(Number);
  let y = a[0], m = a[1];
  while (y < b[0] || (y === b[0] && m <= b[1])) { out.push(y + '-' + pad(m)); m++; if (m > 12) { m = 1; y++; } }
  return out;
}
function isLarge(name) { const m = cfg.models.find(m => m.name === name); return !!(m && m.large); }
function durOf(name) { return isLarge(name) ? cfg.durLarge : cfg.durStd; }

/* ---------- 初期化・ホーム ---------- */
async function init() {
  const q = new URLSearchParams(location.search), hold = q.get('hold');
  // 前回の設定があれば先に表示して、最新の設定は裏で読み込む
  const cached = load('wash_cfg', null);
  if (cached && cached.models && !hold) { cfg = cached; applyCfg(); renderHome(); show('home'); warmUp(); }
  try { cfg = await api('config'); save('wash_cfg', cfg); }
  catch (e) {
    if (cached && !hold) return;
    $('home').innerHTML = '<p class="err">読み込めませんでした。ページを開き直してください。<br>' + esc(e.message) + '</p>'; show('home'); return;
  }
  applyCfg();
  if (hold) return holdView(hold);
  if (!cached) { renderHome(); show('home'); } else if (!$('home').hidden) renderHome();
  warmUp();
}
function applyCfg() {
  $('shop').textContent = cfg.name; document.title = cfg.name;
  const T = cfg.texts || {};
  setText('subline', T['ヘッダー']); setText('homeTitle', T['トップ見出し']); setText('homeLead', T['トップ']); $('goReserve').textContent = T['予約ボタン'] || '予約する'; setText('infoNote', T['お車の情報']);
  setText('waitLead', T['キャンセル待ち']); setText('doneNote', T['完了']);
}
/** 前回のお車がわかっていれば、カレンダーと予約済みの月を先に読み込んでおく */
function warmUp() {
  if (!profile.model || !cfg.models.some(m => m.name === profile.model)) return;
  prefetch(isLarge(profile.model));
  if (profile.plate && profile.email) refreshBooked();
}
/** 文章を入れる。空なら枠ごと隠す */
function setText(id, t) { const e = $(id); e.textContent = t || ''; e.hidden = !t; }
/** 管理画面の「トップご案内」の表 */
function rulesHtml() {
  // 「予約できる日」「月1回」は下の「予約の受付について」で実際の日付つきでまとめて出すので、ここでは省く
  const skip = /^(予約できる日|月1回)\s*[:：]/;
  return String((cfg.texts || {})['トップご案内'] || '').split('\n').map(l => l.trim()).filter(l => l && !skip.test(l)).map(l => {
    const i = l.search(/[:：]/);
    return i < 0 ? `<div><dd>${esc(l)}</dd></div>` : `<div><dt>${esc(l.slice(0, i))}</dt><dd>${esc(l.slice(i + 1))}</dd></div>`;
  }).join('');
}
function renderHome() {
  const up = mine.filter(r => r.date >= cfg.today).sort((a, b) => (a.date + a.start) < (b.date + b.start) ? -1 : 1);
  $('mine').innerHTML = up.length ? '<h3 style="margin-top:0">ご予約中</h3>' + up.map(r => `<div class="res"><div><div class="dt">${dJa(r.date)} ${r.start}〜${r.end}</div><div class="sub">${esc(r.model)}</div></div><div class="no">No.${esc(r.no)}</div></div>`).join('') + '<p class="note">変更・キャンセルは「予約の確認・キャンセル」から。</p>' : '';
}
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { if (b.dataset.go === 'home') renderHome(); show(b.dataset.go); });

/* ---------- お車の情報 ---------- */
let afterInfo = 'cal', selCar = -1, editCars = false, contactOpen = false;
const firstModel = () => cfg.models[0] && cfg.models[0].name;
function goInfo(next) {
  afterInfo = next;
  const i = cars.findIndex(c => np(c.plate) === np(profile.plate));
  selCar = cars.length ? (i >= 0 ? i : 0) : -1; editCars = false;
  contactOpen = !(profile.name && profile.phone && profile.email);
  $('fPlate').value = ''; $('fName').value = profile.name || ''; $('fPhone').value = profile.phone || ''; $('fMail').value = profile.email || '';
  pickCar(selCar); drawContact(); show('info');
}
/** お車を選ぶ。-1 は「別のお車」(入力欄を出す) */
function pickCar(i) {
  selCar = i;
  if (i >= 0) setModel(cars[i].model);
  else setModel(cfg.models.some(m => m.name === profile.model) && !cars.length ? profile.model : firstModel());
  drawGarage();
}
function drawGarage() {
  $('garage').hidden = !cars.length; $('carForm').hidden = selCar >= 0;
  $('carEdit').textContent = editCars ? '完了' : '編集';
  $('carList').innerHTML = cars.map((c, i) => `<div class="car-it"><button type="button" class="carbtn ${i === selCar ? 'on' : ''}" role="radio" aria-checked="${i === selCar}" data-i="${i}"><span class="ci"><b>${esc(c.plate)}</b><small>${esc(c.model)}${isLarge(c.model) ? ' ・ 大型' : ''}</small></span><i class="rd"></i></button>${editCars ? `<button type="button" class="cardel" data-del="${i}" aria-label="${esc(c.plate)}を削除">削除</button>` : ''}</div>`).join('')
    + `<button type="button" class="carbtn add ${selCar < 0 ? 'on' : ''}" role="radio" aria-checked="${selCar < 0}" data-i="-1"><span class="ci"><b>＋ 別のお車を登録</b></span><i class="rd"></i></button>`;
  $('carList').querySelectorAll('[data-i]').forEach(b => b.onclick = () => { pickCar(+b.dataset.i); if (+b.dataset.i < 0) $('fPlate').focus(); });
  $('carList').querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const k = +b.dataset.del; if (!confirm(cars[k].plate + ' をこの端末から削除しますか?')) return;
    cars.splice(k, 1); save('wash_cars', cars);
    if (!cars.length) editCars = false;
    pickCar(selCar === k ? (cars.length ? 0 : -1) : selCar > k ? selCar - 1 : selCar);
  });
}
$('carEdit').onclick = () => { editCars = !editCars; drawGarage(); };
function drawContact() {
  const has = !!(profile.name && profile.phone && profile.email), open = contactOpen || !has;
  $('contactForm').hidden = !open; $('contactSum').hidden = open; $('contactEdit').hidden = open;
  $('contactSum').innerHTML = has ? `<b>${esc(profile.name)} 様</b><span>${esc(profile.phone)} ・ ${esc(profile.email)}</span>` : '';
}
$('contactEdit').onclick = () => { contactOpen = true; drawContact(); $('fName').focus(); };
function updDur() {
  const t = String((cfg.texts || {})['洗車時間'] || '').replace(/\{分\}/g, durOf(curModel));
  setText('durNote', t);
}
let curModel = '';
function setModel(name) {
  curModel = name || '';
  const m = cfg.models.find(m => m.name === curModel);
  drawModels(); updDur();
  if (m) prefetch(!!m.large);
}
/* 車種はタイルを押して選ぶ(並び順は管理画面の順番) */
function drawModels() {
  const el = $('fModel');
  el.innerHTML = cfg.models.map(m => {
    const on = m.name === curModel, wide = [...m.name].length > 4;

function fetchMonth(ym, lg) {
  const k = ym + (lg ? 'L' : 'S'), e = monthCache[k];
  if (e && Date.now() - e.t < 60000) return e.p;
  const pr = api('month', { ym, large: lg }).then(d => {
    const all = load('wash_mc', {}); Object.keys(all).forEach(x => { if (all[x].today !== cfg.today) delete all[x]; });
    all[k] = { today: cfg.today, d }; save('wash_mc', all); return d;
  });
  pr.catch(() => { if (monthCache[k] && monthCache[k].p === pr) delete monthCache[k]; });
  monthCache[k] = { t: Date.now(), p: pr };
  return pr;
}
function cachedMonth(ym, lg) { const c = load('wash_mc', {})[ym + (lg ? 'L' : 'S')]; return c && c.today === cfg.today ? c.d : null; }
function prefetch(lg) { if (cfg) months().forEach(ym => fetchMonth(ym, lg).catch(() => {})); }

/* 予約済みの月(1台につき月1回まで)。端末の記録ですぐ判定し、サーバーの結果で上書きする */

function refreshBooked(plate = profile.plate, email = profile.email) {
  const key = np(plate) + '|' + String(email || '').toLowerCase(); bookedKey = key;
  booked = new Set(localBooked()); markBooked();
  if (!plate || !email) return;
  api('lookup', { email, plate }).then(r => {
    if (bookedKey !== key) return;
    booked = new Set(r.res.map(x => x.date.slice(0, 7)));
    // ほかの端末などでキャンセルされた予約は、端末の記録からも消す
    const nos = new Set(r.res.map(x => String(x.no)));
    const kept = mine.filter(m => !(m.plate && np(m.plate) === np(plate) && m.date >= cfg.today && !nos.has(String(m.no))));

const STATE_JA = { free: '空きあり', few: '残りわずか', full: '満席', closed: '休業日', out: '受付期間外' };

/* ---------- 時間 ---------- */
async function openSlots(d) {
  pick = { date: d };
  $('slotTitle').textContent = dJa(d); $('slotSub').textContent = '開始する時間をお選びください';
  $('slotList').innerHTML = '<p class="empty">読み込み中…</p>'; show('slots');
  try {
    const r = await api('slots', { date: d, large });
    if (!r.starts.length) { $('slotList').innerHTML = '<p class="empty">この日は満席になりました。別の日を選ぶか、キャンセル待ちをご利用ください。</p>'; monthCache = {}; return; }
    const toM = t => +t.slice(0, 2) * 60 + +t.slice(3, 5), list = r.starts;
    const lo = Math.floor(toM(list[0].s) / 60) * 60, hi = Math.ceil(Math.max(...list.map(x => toM(x.e))) / 60) * 60, span = hi - lo || 60;
    const pos = m => ((m - lo) / span * 100).toFixed(2) + '%';
    // 選べる時間帯(開始〜終了の重なりをまとめる)
    const av = []; list.map(x => [toM(x.s), toM(x.e)]).sort((a, b) => a[0] - b[0]).forEach(v => { const l = av[av.length - 1]; if (l && v[0] <= l[1]) l[1] = Math.max(l[1], v[1]); else av.push(v.slice()); });
    const step = span > 360 ? 120 : 60, ticks = [];
    for (let m = lo; m < hi; m += step) ticks.push(`<i style="left:${pos(m)}">${m / 60}:00</i>`);
    const group = (title, arr) => arr.length ? `<h3 class="grp">${title}<small>${arr.length}枠</small></h3><div class="grid">${arr.map(s => `<button class="slot" data-s="${s.s}" data-e="${s.e}" aria-label="${s.s}から${s.e}まで"><b>${s.s}</b><small>〜${s.e}</small></button>`).join('')}</div>` : '';
    $('slotList').innerHTML = `<div class="tl"><div class="tl-card"><div class="tl-head"><b class="ph" id="tlTime">バーをなぞるか、下から選べます</b><span id="tlDur">約${durOf(profile.model)}分</span></div><div class="trackwrap" id="tlTrack" tabindex="0" role="slider" aria-label="開始時間" aria-valuemin="0" aria-valuemax="${list.length - 1}"><div class="track">${av.map(v => `<div class="av" style="left:${pos(v[0])};width:${pos(lo + v[1] - v[0])}"></div>`).join('')}<div class="pick" id="tlPick" style="opacity:0"></div></div></div><div class="ticks">${ticks.join('')}</div></div></div>`
      + group('午前', list.filter(s => s.s < '12:00')) + group('午後', list.filter(s => s.s >= '12:00'));
    const track = $('tlTrack'), btns = [...$('slotList').querySelectorAll('.slot')];
    let cur = null;
    const choose = (b, drag) => {
      if (!b || b === cur) return; cur = b;
      btns.forEach(x => x.classList.toggle('on', x === b));
      pick.start = b.dataset.s; pick.end = b.dataset.e;
      const pk = $('tlPick'), a = toM(pick.start), e = toM(pick.end);
      pk.style.left = pos(a); pk.style.width = pos(lo + e - a); pk.style.opacity = 1;
      $('tlTime').className = ''; $('tlTime').textContent = pick.start + ' → ' + pick.end;
      track.setAttribute('aria-valuenow', btns.indexOf(b)); track.setAttribute('aria-valuetext', pick.start + 'から' + pick.end + 'まで');
      if (drag && navigator.vibrate) navigator.vibrate(4);
      setBar({ main: dShort(d) + ' ' + pick.start + '〜' + pick.end, sub: profile.model + ' / ' + profile.plate, label: 'この時間で予約', fn: doReserve });
    };
    btns.forEach(b => b.onclick = () => choose(b));
    // 黒いバーをなぞって時間を選ぶ(指の位置にいちばん近い枠へ吸い付く)
    const at = x => {
      const r = track.querySelector('.track').getBoundingClientRect(), m = lo + Math.min(1, Math.max(0, (x - r.left) / r.width)) * span;
      let best = null, bd = Infinity;
      btns.forEach(b => { const c = (toM(b.dataset.s) + toM(b.dataset.e)) / 2, dd = Math.abs(c - m); if (dd < bd) { bd = dd; best = b; } });
      return best;
    };
    let dragging = false;
    track.onpointerdown = e => { dragging = true; try { track.setPointerCapture(e.pointerId); } catch (_) {} track.classList.add('drag'); choose(at(e.clientX), true); };
    track.onpointermove = e => { if (dragging) choose(at(e.clientX), true); };
    track.onpointerup = track.onpointercancel = () => { dragging = false; track.classList.remove('drag'); };
    track.onkeydown = e => {
      const k = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key]; if (!k) return;
      e.preventDefault(); choose(btns[cur ? btns.indexOf(cur) + k : 0]);
    };
  } catch (e) { $('slotList').innerHTML = '<p class="err">' + esc(e.message) + '</p>'; }
}

    const h = await api('holdInfo', { token });
    $('holdBody').innerHTML = `<p class="lead">${h.until} までに、下のボタンで予約を確定してください。過ぎると次の方へご案内します。</p><dl class="facts"><div><dt>日時</dt><dd>${dJa(h.date)} ${h.start}〜${h.end}</dd></div><div><dt>お車</dt><dd>${esc(h.model)}</dd></div><div><dt>ナンバー</dt><dd>${esc(h.plate)}</dd></div><div><dt>お名前</dt><dd>${esc(h.name)} 様</dd></div></dl><button class="cta" id="hGo">予約を確定する</button>`;
    $('hGo').onclick = busy($('hGo'), async () => {
      const r = await api('holdConfirm', { token });
      mine.push({ no: r.no, date: r.date, start: r.start, end: r.end, model: r.model, plate: h.plate }); save('wash_mine', mine);
      history.replaceState(null, '', location.pathname); doneView(r, '予約が確定しました');
    });
  } catch (e) { $('holdBody').innerHTML = '<p class="err">' + esc(e.message) + '</p><button class="ghost" onclick="location.href=location.pathname">トップへ</button>'; }
}

/* ---------- 洗車システムについて ---------- */
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let installEv = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEv = e; });
addEventListener('appinstalled', () => { installEv = null; });
/** 予約受付のしくみ(いま予約できる期間を実際の日付で出す) */
function windowHtml() {
  const t = cfg.today.split('-').map(Number), x = cfg.max.split('-').map(Number), n = (x[0] * 12 + x[1]) - (t[0] * 12 + t[1]);
  const from = cfg.min === cfg.today ? '今日' : '明日';
  const md = d => { const a = d.split('-'); return (+a[1]) + '月' + (+a[2]) + '日'; };
  return `<ul class="pts">
    <li><span class="now">いま予約できるのは ${dJa(cfg.min)} 〜 ${dJa(cfg.max)}</span>${from}から、${n}か月先の同じ日までご予約いただけます。</li>
    <li>毎日1日ずつ、新しい日が予約できるようになります(今日が${md(cfg.today)}なら${md(cfg.max)}まで)。</li>
    <li>${n}か月先に同じ日がないとき(例: 12月30日・31日 → 2月)は、その月の末日で止まり、数日のあいだ新しい日は開きません。月をまたぐときは、2日ぶんが一度に開くこともあります。</li>
    <li><b>お車1台につき、月1回まで</b>です。別の月なら、同じ日にまとめてご予約いただけます。</li>
    <li>満席の日は、カレンダーで日にちを押すと<b>キャンセル待ち</b>に登録できます。空きが出たら登録順にメールでご案内します。</li>
  </ul>`;
}
function installHtml() {
  if (isStandalone()) return '<div class="inst"><img src="apple-touch-icon.png" alt=""><div><b>ホーム画面から開いています</b>このままアプリのようにお使いいただけます。</div></div>';
  return `<div class="inst"><img src="apple-touch-icon.png" alt=""><div><b>アプリのように使えます</b>ホーム画面に追加すると、すぐに開けて、登録したお車の情報も残りやすくなります。</div></div>
    ${installEv ? '<button class="inst-go" id="instGo">ホーム画面に追加する</button>' : ''}
    <ol class="steps">
      <li class="os">iPhone(Safari)</li>
      <li>画面下の共有ボタン(□に↑のマーク)を押す</li>
      <li>「ホーム画面に追加」を選び、右上の「追加」を押す</li>
      <li class="os">Android(Chrome)</li>
      <li>右上のメニュー(︙)を押す</li>
      <li>「ホーム画面に追加」または「アプリをインストール」を選ぶ</li>
    </ol>
    ${isIOS ? '<p class="note">※ LINEなどのアプリ内で開いている場合は、一度Safariで開いてから追加してください。</p>' : ''}`;
}
function openAbout() {
  const rules = rulesHtml();
  $('aboutBody').innerHTML = '<div class="notice">この予約はレクサス鹿児島東開でのみ有効です。</div>'
    + (rules ? '<h4>ご案内</h4><dl class="rules">' + rules + '</dl>' : '')
    + '<h4>予約の受付について</h4>' + windowHtml()
    + '<h4>ホーム画面に追加する</h4>' + installHtml();
  const go = $('instGo');
  if (go) go.onclick = async () => { installEv.prompt(); await installEv.userChoice; installEv = null; openAbout(); };
  $('aboutBg').hidden = false; $('about').hidden = false; $('aboutBody').scrollTop = 0;
  document.addEventListener('keydown', aboutKey); $('aboutX').focus();
}
function closeAbout() { $('aboutBg').hidden = true; $('about').hidden = true; document.removeEventListener('keydown', aboutKey); $('aboutBtn').focus(); }
const aboutKey = e => { if (e.key === 'Escape') closeAbout(); };
$('aboutBtn').onclick = openAbout; $('aboutX').onclick = closeAbout; $('aboutBg').onclick = closeAbout;
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

init();
</script>
</body>
</html>
