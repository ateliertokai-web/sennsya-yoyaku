<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f5f4f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="予約受付">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>洗車予約 予約スタッフ</title>
<style>
:root{--ink:#1d1d1f;--sub:#6e6e73;--mute:#a1a1a6;--line:#e9e8e5;--bg:#f5f4f1;--card:#fff;--soft:#f2f1ee;--gold:#b8954a;--red:#c4412d;--r:10px;--rl:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;letter-spacing:.02em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;letter-spacing:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
.head{position:sticky;top:0;z-index:5;background:rgba(245,244,241,.92);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);box-shadow:0 1px 0 var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:820px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px 12px}
.top h1{display:flex;align-items:center;gap:10px;margin:0;font-size:15px;font-weight:600;letter-spacing:.12em;white-space:nowrap}
.top h1::before{content:"";width:5px;height:20px;border-radius:3px;background:linear-gradient(#d6b46a,#a8853d)}
.top h1 small{font-size:11.5px;font-weight:500;color:var(--sub);letter-spacing:.08em}
.who{display:flex;align-items:center;gap:6px;min-width:0}
.who span{font-size:11.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
.top button{min-height:34px;padding:0 12px;border:0;border-radius:99px;background:none;color:var(--sub);font-size:13px}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 80px}
.card{background:var(--card);border-radius:var(--rl);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.03)}
.btn{min-height:46px;padding:0 20px;border:0;border-radius:99px;background:var(--ink);color:#fff;font-weight:600;letter-spacing:.06em;white-space:nowrap}
.btn.sub{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.btn.danger{background:#fbefec;color:var(--red)}
.btn:disabled{opacity:.5}
.big{display:block;width:100%;min-height:58px;font-size:16px}
label{display:block;margin:14px 2px 6px;font-size:12.5px;font-weight:600;color:var(--sub);letter-spacing:.04em}
input,select{width:100%;height:46px;padding:0 14px;border:0;border-radius:var(--r);background:var(--soft);font:inherit;font-size:16px;color:var(--ink)}
input,select{min-width:0;max-width:100%;display:block}
input[type=date]{-webkit-appearance:none;appearance:none}
.range>*,.grid2>*,.find>*{min-width:0}
html,body{overflow-x:hidden}
input:focus,select:focus{outline:none;background:#fff;box-shadow:0 0 0 1.5px var(--ink)}
.note{font-size:12.5px;color:var(--sub)}
.err{color:var(--red);font-size:13px;margin:10px 2px 0}
/* ログイン */
#login{max-width:380px;margin:12vh auto 0;padding:30px 26px 26px}
#login h2{margin:0 0 4px;font-size:20px;font-weight:600;letter-spacing:.06em}
#login .btn{width:100%;margin-top:18px}
.linkbtn{display:block;margin:16px auto 0;padding:8px;border:0;background:none;font-size:13px;color:var(--sub);text-decoration:underline}
.gbtn{display:flex;justify-content:center;min-height:44px}
/* 探す */
.find{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}
.range{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin-top:8px}
.range span{color:var(--sub);font-size:13px}
.count{margin:18px 4px 0;font-size:12.5px;color:var(--sub)}
.day{margin-top:18px}
.day h4{margin:0 4px 8px;font-size:14px;font-weight:600}
.day h4 span{margin-left:8px;font-size:12px;font-weight:500;color:var(--mute)}
.it{display:grid;grid-template-columns:58px 1fr;gap:4px 14px;padding:14px 16px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.tm{font-size:16px;font-weight:600;line-height:1.3;font-variant-numeric:tabular-nums}
.tm small{display:block;font-size:11.5px;font-weight:500;color:var(--mute)}
.nm{font-weight:600}
.s{font-size:13px}
.s2{font-size:12.5px;color:var(--sub);overflow-wrap:anywhere}
.s2 a{color:var(--ink)}
.s3{font-size:12px;color:#7a5a17}
.acts{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.tag{display:inline-block;margin-left:6px;padding:0 8px;border-radius:99px;background:var(--soft);font-size:11px;font-weight:600;line-height:1.75;color:var(--sub);vertical-align:2px}
.tag.l{background:#f3ecdc;color:#8a6a2a}.tag.w{background:#fdecd2;color:#9a5300}.tag.ph{background:#e8f0fb;color:#2a5590}
.empty{padding:40px 0;text-align:center;color:var(--mute);font-size:14px}
/* 予約を入れる・変える */
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:640px;max-height:92vh;margin:0 auto;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom));background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h3{margin:0;font-size:17px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.slots button{min-width:76px;min-height:44px;border:0;border-radius:10px;background:var(--soft);font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums}
.slots button.on{background:var(--ink);color:#fff}
.slots button:disabled{color:#c2c1bc;text-decoration:line-through}
.loader{position:fixed;left:0;right:0;top:calc(12px + env(safe-area-inset-top));z-index:60;width:max-content;margin:0 auto;padding:9px 18px;border-radius:18px;background:rgba(29,29,31,.94);color:#fff;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.loader.show{opacity:1}
</style>
</head>
<body>
<div class="head" id="head" hidden><div class="top"><h1>洗車予約 <small>予約スタッフ</small></h1><div class="who"><span id="whoName"></span><button id="logout">ログアウト</button></div></div></div>
<div class="wrap">
  <div class="card" id="login">
    <h2>予約スタッフ</h2>
    <p class="note" style="margin:0 0 6px">お客様からのお電話で、予約を入れる・変える・取り消す画面です。</p>
    <div id="pwLogin">
      <label for="lEmail">メールアドレス</label>
      <input type="email" id="lEmail" autocomplete="username">
      <label for="pw">パスワード</label>
      <input type="password" id="pw" autocomplete="current-password">
      <button class="btn" id="loginBtn">ログイン</button>
    </div>
    <div id="gLogin" hidden>
      <p class="note" style="margin:6px 0 16px">会社の Google アカウントでログインしてください。</p>
      <div id="gBtn" class="gbtn"></div>
      <button type="button" class="linkbtn" id="toPw">メールアドレスとパスワードでログイン</button>
    </div>
    <p class="err" id="loginErr"></p>
  </div>

  <div id="app" hidden>
    <button class="btn big" id="addRes">＋ 電話の予約を入れる</button>
    <div class="card" style="margin-top:14px;padding:4px 16px 16px">
      <label for="q">予約を探す(お名前・電話番号・ナンバー・予約番号)</label>
      <div class="find" style="margin-top:0"><input type="search" id="q" placeholder="例: 山田 / 090 / 1234" enterkeyhint="search"><button class="btn" id="go">探す</button></div>
      <div class="range"><input type="date" id="from" aria-label="期間のはじめ"><span>〜</span><input type="date" id="to" aria-label="期間のおわり"></div>
    </div>
    <div id="list"></div>
  </div>
</div>

<div class="sheet-bg" id="fBg" hidden></div>
<div class="sheet" id="form" role="dialog" aria-modal="true" aria-labelledby="fTitle" hidden>
  <div class="hd"><h3 id="fTitle">電話の予約を入れる</h3><button class="btn sub sm" id="fClose">閉じる</button></div>
  <p class="note" id="fNote" style="margin:6px 0 0"></p>
  <div id="fCar"><label for="fModel">車種</label><select id="fModel"></select></div>
  <label for="fDate">日付</label><input type="date" id="fDate">
  <label>開始時間</label><div class="slots" id="fSlots"><span class="note">日付を選ぶと空き時間が出ます</span></div>
  <div id="fCust">
    <div class="grid2"><div><label for="fName">お名前</label><input type="text" id="fName" autocomplete="off"></div><div><label for="fPhone">電話番号</label><input type="tel" id="fPhone" autocomplete="off"></div></div>
    <label for="fPlate">車両ナンバー</label><input type="text" id="fPlate" placeholder="鹿児島 330 あ 12-34" autocomplete="off">
    <label for="fMail">メールアドレス <span class="note">(任意。入れると確認メールが届きます)</span></label><input type="email" id="fMail" autocomplete="off">
    <div id="fStaffBox"><label for="fStaff">担当スタッフ</label><select id="fStaff"></select></div>
    <label for="fMemo">メモ <span class="note">(洗車スタッフの画面にも出ます)</span></label><input type="text" id="fMemo" maxlength="200" autocomplete="off">
  </div>
  <button class="btn big" id="fGo" style="margin-top:18px">この内容で入れる</button>
</div>
<div class="loader" id="loader" role="status" aria-live="polite">読み込み中…</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script>
const API = (window.WASH_CONFIG && window.WASH_CONFIG.api) || 'https://script.google.com/macros/s/AKfycbzHj9e15-2k4kkNa63ctM0P2KBXVbKfzGJGvhBNKXl0Er2u5_75qR7Kmev8Z0TzTdcg/exec';
const GA = window.WashAuth || { enabled: false };
const $ = id => document.getElementById(id);
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dJa = d => { const a = d.split('-'); return (+a[1]) + '/' + (+a[2]) + '(' + WD[new Date(+a[0], a[1] - 1, +a[2]).getDay()] + ')'; };
const fmt = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
let n0 = 0, lt = 0;
async function waiting(p) { if (n0++ === 0) lt = setTimeout(() => $('loader').classList.add('show'), 250); try { return await p; } finally { if (--n0 === 0) { clearTimeout(lt); $('loader').classList.remove('show'); } } }

/* ログイン: 個人のメールアドレス+パスワード(Google ログインのときは Google でも入れる) */
let pw = sessionStorage.getItem('wash_desk_pw') || '', email = sessionStorage.getItem('wash_desk_email') || '', D = null;
const usePw = () => !GA.enabled || !!email;
async function api(action, data, retried) {
  const cred = usePw() ? Object.assign({ pw }, email ? { email } : {}) : { idToken: GA.token };
  let r;
  try { r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action }, cred, data || {})) }); }
  catch (e) { throw new Error('通信できませんでした'); }
  const j = await r.json();
  if (!j.ok) {
    if (/^LOGIN:/.test(j.error)) {
      const msg = j.error.slice(6);
      if (!usePw() && !retried && GA.token && /期限|し直/.test(msg)) { try { await GA.refresh(); return api(action, data, true); } catch (e) {} }
      showLogin(msg); throw new Error(msg);
    }
    throw new Error(j.error.replace(/^MONTH:/, ''));
  }
  return j.data;
}
const call = (a, d) => waiting(api(a, d));
let pwForm = false;
function showLogin(msg) {
  pw = ''; email = ''; sessionStorage.removeItem('wash_desk_pw'); sessionStorage.removeItem('wash_desk_email');
  $('app').hidden = true; $('head').hidden = true; $('login').hidden = false; $('loginErr').textContent = msg || '';
  if (GA.enabled && !pwForm) { GA.clear(); $('pwLogin').hidden = true; $('gLogin').hidden = false; GA.button($('gBtn')); }
  else { $('pwLogin').hidden = false; $('gLogin').hidden = true; }
}
async function enter() {
  D = await call('deskInit');
  $('login').hidden = true; $('app').hidden = false; $('head').hidden = false;
  $('whoName').textContent = D.me.email; document.title = D.name + ' 予約スタッフ';
  if (!$('from').value) { $('from').value = D.today; const t = new Date(D.today); t.setMonth(t.getMonth() + 3); $('to').value = fmt(t); }
  await loadList();
}
$('toPw').onclick = () => { pwForm = true; $('gLogin').hidden = true; $('pwLogin').hidden = false; $('lEmail').focus(); };
$('loginBtn').onclick = async () => {
  pw = $('pw').value; email = $('lEmail').value.trim().toLowerCase(); $('loginErr').textContent = '';
  if (!pw) return;
  if (GA.enabled && !email) { $('loginErr').textContent = 'メールアドレスを入れてください'; return; }
  $('loginBtn').disabled = true;
  try { await enter(); sessionStorage.setItem('wash_desk_pw', pw); if (email) sessionStorage.setItem('wash_desk_email', email); }
  catch (e) { $('loginErr').textContent = e.message; pw = ''; email = ''; }
  finally { $('loginBtn').disabled = false; }
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
$('lEmail').addEventListener('keydown', e => { if (e.key === 'Enter') $('pw').focus(); });
$('logout').onclick = () => { sessionStorage.removeItem('wash_desk_pw'); sessionStorage.removeItem('wash_desk_email'); if (GA.enabled) GA.signOut(); location.reload(); };

/* 予約の一覧 */
let LIST = [];
async function loadList() {
  $('list').innerHTML = '<p class="empty">読み込み中…</p>';
  LIST = await call('deskRes', { from: $('from').value, to: $('to').value, q: $('q').value.trim() });
  const by = {}; LIST.forEach(r => (by[r.date] = by[r.date] || []).push(r));
  const q = $('q').value.trim();
  $('list').innerHTML = LIST.length ? `<p class="count">${q ? '「' + esc(q) + '」で ' : ''}${LIST.length}件</p>` + Object.keys(by).map(d => `<section class="day"><h4>${dJa(d)}<span>${by[d].length}件</span></h4><div class="card">` + by[d].map(r =>
    `<div class="it"><div class="tm">${r.start}<small>〜${r.end}</small></div><div><div class="nm">${esc(r.name)} 様${r.large ? '<span class="tag l">大型</span>' : ''}${r.status === '保留' ? '<span class="tag w">キャンセル待ちの案内中</span>' : ''}${r.source === '管理画面' ? '<span class="tag ph">電話など</span>' : ''}</div>`
    + `<div class="s">${esc(r.model)} ・ ${esc(r.plate)}${r.staff ? ' ・ 担当 ' + esc(r.staff) : ''}</div>`
    + `<div class="s2">${r.phone ? `<a href="tel:${esc(r.phone.replace(/[^\d+]/g, ''))}">${esc(r.phone)}</a> ・ ` : ''}${r.email ? esc(r.email) + ' ・ ' : ''}No.${esc(r.no || '-')}</div>${r.memo ? `<div class="s3">メモ: ${esc(r.memo)}</div>` : ''}</div>`
    + (r.status === '予約' ? `<div class="acts"><button class="btn sub sm" data-ch="${r.id}">日時を変更</button><button class="btn danger sm" data-cx="${r.id}">取り消す</button></div>` : '')
    + '</div>').join('') + '</div></section>').join('') : `<p class="empty">${q ? '見つかりませんでした。' : 'この期間の予約はありません。'}</p>`;
  $('list').querySelectorAll('[data-ch]').forEach(b => b.onclick = () => openForm(LIST.find(x => x.id === b.dataset.ch)));
  $('list').querySelectorAll('[data-cx]').forEach(b => b.onclick = async () => {
    const r = LIST.find(x => x.id === b.dataset.cx);
    if (!confirm(`${r.name} 様の ${dJa(r.date)} ${r.start} のご予約を取り消しますか?\n${r.email ? 'お客様にキャンセルのメールが届きます。' : ''}空いた枠はキャンセル待ちの方へご案内します。`)) return;
    b.disabled = true;
    try { await call('deskCancel', { id: r.id }); await loadList(); } catch (e) { alert(e.message); b.disabled = false; }
  });
}
$('go').onclick = () => loadList().catch(e => alert(e.message));
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });
$('from').onchange = $('to').onchange = () => loadList().catch(e => alert(e.message));

/* 予約を入れる・日時を変える */
let fMode = null, fPick = null;
function openForm(chg) {
  fMode = chg || null; fPick = null;
  $('fTitle').textContent = chg ? '日時を変更する' : '電話の予約を入れる';
  $('fNote').textContent = chg ? `${chg.name} 様 ・ ${chg.model} ・ ${chg.plate}(いま: ${dJa(chg.date)} ${chg.start}〜)。${chg.email ? 'お客様に変更のお知らせメールが届きます。' : ''}` : 'お客様に、車種・ご希望の日時・お名前・電話番号・ナンバーを伺って入れてください。';
  $('fCust').hidden = !!chg; $('fCar').hidden = !!chg;
  $('fModel').innerHTML = D.models.map(m => `<option>${esc(m.name)}</option>`).join('');
  const st = D.staff || []; $('fStaffBox').hidden = !st.length;
  $('fStaff').innerHTML = '<option value="">(指定なし)</option>' + st.map((x, i) => `<option value="${i}">${esc((x.store ? x.store + ' ・ ' : '') + x.name)}</option>`).join('');
  if (!chg) ['fName', 'fPhone', 'fPlate', 'fMail', 'fMemo'].forEach(id => $(id).value = '');
  $('fDate').min = D.today; $('fDate').value = chg ? chg.date : '';
  $('fGo').textContent = chg ? 'この日時に変更する' : 'この内容で入れる';
  $('fSlots').innerHTML = '<span class="note">日付を選ぶと空き時間が出ます</span>';
  $('fBg').hidden = false; $('form').hidden = false; $('form').scrollTop = 0;
  if (chg) loadSlots();
}
function closeForm() { $('fBg').hidden = true; $('form').hidden = true; }
$('addRes').onclick = () => openForm(null);
$('fClose').onclick = closeForm; $('fBg').onclick = closeForm;
async function loadSlots() {
  const d = $('fDate').value; fPick = null; if (!d) return;
  $('fSlots').innerHTML = '<span class="note">読み込み中…</span>';
  const large = (D.models.find(m => m.name === $('fModel').value) || {}).large;
  try {
    const r = await call('deskSlots', Object.assign({ date: d, large: !!large }, fMode ? { exceptId: fMode.id } : {}));
    if (r.closed) { $('fSlots').innerHTML = '<span class="note">休業日です</span>'; return; }
    $('fSlots').innerHTML = r.all.length ? r.all.map(x => `<button type="button" data-s="${x.s}" ${x.ok ? '' : 'disabled'}>${x.s}</button>`).join('') : '<span class="note">受付できる時間がありません</span>';
    if (r.all.length && !r.all.some(x => x.ok)) $('fSlots').insertAdjacentHTML('beforeend', '<p class="note" style="width:100%;margin:6px 0 0">この日は満席です。</p>');
    $('fSlots').querySelectorAll('[data-s]').forEach(b => b.onclick = () => { fPick = b.dataset.s; $('fSlots').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); });
  } catch (e) { $('fSlots').innerHTML = '<span class="note">' + esc(e.message) + '</span>'; }
}
$('fDate').onchange = loadSlots; $('fModel').onchange = loadSlots;
$('fGo').onclick = async () => {
  if (!fPick) return alert('開始時間を選んでください');
  if (!fMode && (!$('fName').value.trim() || !$('fPlate').value.trim() || !$('fPhone').value.trim())) return alert('お名前・電話番号・車両ナンバーを入れてください');
  const send = async force => {
    try {
      if (fMode) return await call('deskChange', { id: fMode.id, date: $('fDate').value, start: fPick, force });
      const sv0 = $('fStaff').value, st = sv0 === '' ? null : D.staff[+sv0];
      return await call('deskReserve', { date: $('fDate').value, start: fPick, model: $('fModel').value, name: $('fName').value.trim(), phone: $('fPhone').value.trim(), plate: $('fPlate').value.trim(), custEmail: $('fMail').value.trim(), memo: $('fMemo').value.trim(), staff: st ? st.name : '', staffStore: st ? st.store || '' : '', force });
    } catch (e) {
      if (!force && /月1回/.test(e.message) && confirm(e.message + '\n\nそれでも入れますか?')) return send(true);
      throw e;
    }
  };
  $('fGo').disabled = true;
  try {
    const r = await send(false); if (!r) return;
    closeForm();
    alert(fMode ? '日時を変更しました' : '予約を入れました。\n予約番号: ' + r.no + '\nお客様に予約番号をお伝えください。');
    await loadList();
  } catch (e) { alert(e.message); }
  finally { $('fGo').disabled = false; }
};

if (GA.enabled) {
  GA.onSignIn = () => { $('loginErr').textContent = ''; enter().catch(e => { $('loginErr').textContent = e.message; }); };
  if (email && pw) enter().catch(() => {}); else if (GA.token) enter().catch(() => {}); else showLogin('');
} else if (pw) enter().catch(() => showLogin(''));
</script>
