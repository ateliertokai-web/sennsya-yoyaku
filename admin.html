<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>洗車予約 管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f4f5f7;color:#1f2937;line-height:1.5}
header{background:#1f2937;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:16px}
main{max-width:760px;margin:0 auto;padding:14px 12px 60px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
label{display:block;font-size:12px;font-weight:600;margin:10px 0 3px;color:#4b5563}
input,select{width:100%;padding:10px;font-size:16px;border:1px solid #cfd4dc;border-radius:8px;background:#fff}
input[type=checkbox]{width:auto}
button{font:inherit;cursor:pointer}
.btn{padding:11px 16px;border:0;border-radius:10px;background:#ff9800;color:#fff;font-weight:700}
.btn.sub{background:#fff;color:#1f2937;border:1px solid #cfd4dc}
.btn.danger{background:#e53935}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tab{padding:10px 14px;border:1px solid #cfd4dc;border-radius:10px;background:#fff;font-weight:600;white-space:nowrap}
.tab.on{background:#1f2937;color:#fff;border-color:#1f2937}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.row>div{flex:1;min-width:120px}
.item{border-top:1px solid #e5e7eb;padding:10px 0;display:flex;gap:10px;justify-content:space-between;align-items:center}
.item:first-child{border-top:0}
.t{font-weight:700}
.note{font-size:12px;color:#6b7280}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:#ffe0b2;color:#e65100;margin-left:4px}
.pill.l{background:#bbdefb;color:#0d47a1}
[hidden]{display:none!important}
.err{color:#c62828}
</style>
</head>
<body>
<header><h1>洗車予約 管理画面</h1><button class="btn sub sm" id="logout" hidden>ログアウト</button></header>
<main>

<div class="card" id="login">
  <label>管理者パスワード</label>
  <input type="password" id="pw" autocomplete="current-password">
  <p><button class="btn" id="loginBtn">ログイン</button></p>
  <p class="err" id="loginErr"></p>
</div>

<div id="app" hidden>
  <div class="tabs">
    <button class="tab on" data-t="res">予約一覧</button>
    <button class="tab" data-t="wait">キャンセル待ち</button>
    <button class="tab" data-t="set">設定</button>
  </div>

  <div id="t-res" class="card">
    <div class="row">
      <div><label>から</label><input type="date" id="from"></div>
      <div><label>まで</label><input type="date" id="to"></div>
      <div style="flex:0"><button class="btn" id="resGo">表示</button></div>
    </div>
    <div id="resList"></div>
  </div>

  <div id="t-wait" class="card" hidden>
    <p class="note">登録順に並んでいます。「通知中」は空き枠を確保して案内メールを送った状態です(保留時間を過ぎると次の方へ)。</p>
    <div id="waitList"></div>
  </div>

  <div id="t-set" hidden>
    <div class="card"><b>基本設定</b><div id="setList"></div></div>
    <div class="card"><b>車種(「大型」にチェックした車種は洗車時間が長くなります)</b>
      <div id="modelList"></div>
      <p><button class="btn sub sm" id="addModel">+ 車種を追加</button></p>
    </div>
    <div class="card"><b>休業日(臨時休業など)</b>
      <div id="holList"></div>
      <div class="row"><div><label>日付</label><input type="date" id="holDate"></div><div><label>メモ</label><input type="text" id="holNote"></div><div style="flex:0"><button class="btn sub sm" id="addHol">追加</button></div></div>
    </div>
    <p><button class="btn" id="saveSet">設定を保存</button></p>
  </div>
</div>
</main>

<script>
/* ★ GASをウェブアプリとして公開したURLに書き換えてください(index.htmlと同じ) */
const API = 'https://script.google.com/macros/s/AKfycbzHj9e15-2k4kkNa63ctM0P2KBXVbKfzGJGvhBNKXl0Er2u5_75qR7Kmev8Z0TzTdcg/exec';

const $ = id => document.getElementById(id);
const WD = ['日','月','火','水','木','金','土'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dJa = d => { const a = d.split('-'); return (+a[1]) + '/' + (+a[2]) + '(' + WD[new Date(+a[0], a[1]-1, +a[2]).getDay()] + ')'; };
let pw = sessionStorage.getItem('wash_admin_pw') || '', G = null;

async function api(action, data) {
  let r;
  try { r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, pw }, data || {})) }); }
  catch (e) { throw new Error('通信できませんでした'); }
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
function busy(btn, fn) { return async () => { btn.disabled = true; try { await fn(); } catch (e) { alert(e.message); } finally { btn.disabled = false; } }; }

async function enter() {
  $('login').hidden = true; $('app').hidden = false; $('logout').hidden = false;
  const t = new Date(), f = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  $('from').value = f(t); const e = new Date(t); e.setMonth(e.getMonth() + 3); $('to').value = f(e);
  await loadRes();
}
$('loginBtn').onclick = busy($('loginBtn'), async () => {
  pw = $('pw').value; $('loginErr').textContent = '';
  try { await api('adminGet'); sessionStorage.setItem('wash_admin_pw', pw); await enter(); }
  catch (e) { $('loginErr').textContent = e.message; pw = ''; }
});
$('logout').onclick = () => { sessionStorage.removeItem('wash_admin_pw'); location.reload(); };
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  ['res', 'wait', 'set'].forEach(k => $('t-' + k).hidden = k !== b.dataset.t);
  if (b.dataset.t === 'wait') loadWait(); if (b.dataset.t === 'set') loadSet();
});

/* 予約一覧 */
async function loadRes() {
  $('resList').innerHTML = '<p class="note">読み込み中…</p>';
  const list = await api('adminRes', { from: $('from').value, to: $('to').value });
  $('resList').innerHTML = list.length ? list.map(r => `<div class="item"><div><div class="t">${dJa(r.date)} ${r.start}〜${r.end}<span class="pill ${r.large ? 'l' : ''}">${r.large ? '大型' : '普通'}</span>${r.status === '保留' ? '<span class="pill">案内中</span>' : ''}</div><div>${esc(r.name)} / ${esc(r.model)} / ${esc(r.plate)}</div><div class="note">${esc(r.phone)} ・ ${esc(r.email)} ・ No.${esc(r.no)}</div></div><button class="btn danger sm" data-c="${r.id}">取消</button></div>`).join('') : '<p class="note">予約はありません。</p>';
  $('resList').querySelectorAll('[data-c]').forEach(b => b.onclick = busy(b, async () => {
    if (!confirm('この予約を取り消しますか?(お客様へキャンセルメールを送り、キャンセル待ちの方へ案内します)')) return;
    await api('adminCancel', { id: b.dataset.c }); await loadRes();
  }));
}
$('resGo').onclick = busy($('resGo'), loadRes);

/* キャンセル待ち */
async function loadWait() {
  $('waitList').innerHTML = '<p class="note">読み込み中…</p>';
  const list = await api('adminWaits');
  $('waitList').innerHTML = list.length ? list.map((w, i) => `<div class="item"><div><div class="t">${i + 1}. ${esc(w.name)} / ${esc(w.model)} / ${esc(w.plate)}<span class="pill">${esc(w.state)}</span></div><div>${esc(w.summary)}(対象${w.count}日)</div><div class="note">登録 ${esc(w.created)} ・ ${esc(w.phone)} ・ ${esc(w.email)}</div></div><button class="btn danger sm" data-w="${w.id}">削除</button></div>`).join('') : '<p class="note">キャンセル待ちはありません。</p>';
  $('waitList').querySelectorAll('[data-w]').forEach(b => b.onclick = busy(b, async () => {
    if (!confirm('このキャンセル待ちを削除しますか?')) return;
    await api('adminWaitStop', { id: b.dataset.w }); await loadWait();
  }));
}

/* 設定 */
async function loadSet() {
  G = await api('adminGet'); drawSet();
}
const GROUPS = [
  ['台数・時間', [['同時洗車台数', 'number'], ['開始', 'time'], ['最終開始(普通)', 'time'], ['最終開始(大型)', 'time'], ['昼休憩開始', 'time'], ['昼休憩終了', 'time'], ['洗車分(普通)', 'number'], ['洗車分(大型)', 'number'], ['刻み分', 'number']]],
  ['予約ルール', [['先行月数', 'number'], ['解禁時刻', 'time'], ['最短日数', 'number'], ['定休曜日', 'text'], ['保留時間(分)', 'number']]],
  ['表示・メール', [['店舗名', 'text'], ['サイトURL', 'text'], ['問い合わせ先', 'text']]]
];
const sv = k => G.settings.find(s => s.k === k);
const tv = v => { const m = String(v).match(/^(\d{1,2}):(\d{2})/); return m ? m[1].padStart(2, '0') + ':' + m[2] : ''; };
function drawSet() {
  $('setList').innerHTML = GROUPS.map(g => `<h3 style="margin:16px 0 4px;font-size:14px">${g[0]}</h3>` + g[1].map(f => {
    const s = sv(f[0]); if (!s) return '';
    const val = f[1] === 'time' ? tv(s.v) : s.v;
    return `<label>${esc(f[0])}${s.d ? ' <span class="note">— ' + esc(s.d) + '</span>' : ''}</label><input type="${f[1] === 'number' ? 'number' : f[1]}" ${f[1] === 'number' ? 'inputmode="numeric" min="0"' : ''} data-k="${esc(f[0])}" value="${esc(val)}">`;
  }).join('')).join('');
  $('setList').querySelectorAll('[data-k]').forEach(e => e.oninput = () => { sv(e.dataset.k).v = e.value; });
  $('modelList').innerHTML = G.models.map((m, i) => `<div class="row" style="margin-bottom:6px"><div><input type="text" data-mn="${i}" value="${esc(m.name)}"></div><div style="flex:0;white-space:nowrap"><label style="display:inline"><input type="checkbox" data-ml="${i}" ${m.large ? 'checked' : ''}> 大型</label></div><div style="flex:0"><button class="btn danger sm" data-md="${i}">削除</button></div></div>`).join('');
  $('holList').innerHTML = G.holidays.length ? G.holidays.map((h, i) => `<div class="item"><div>${esc(h.date)} ${esc(h.note || '')}</div><button class="btn danger sm" data-hd="${i}">削除</button></div>`).join('') : '<p class="note">登録なし</p>';
  $('modelList').querySelectorAll('[data-mn]').forEach(e => e.oninput = () => G.models[e.dataset.mn].name = e.value);
  $('modelList').querySelectorAll('[data-ml]').forEach(e => e.onchange = () => G.models[e.dataset.ml].large = e.checked);
  $('modelList').querySelectorAll('[data-md]').forEach(e => e.onclick = () => { G.models.splice(+e.dataset.md, 1); drawSet(); });
  $('holList').querySelectorAll('[data-hd]').forEach(e => e.onclick = () => { G.holidays.splice(+e.dataset.hd, 1); drawSet(); });
}
$('addModel').onclick = () => { G.models.push({ name: '', large: false }); drawSet(); };
$('addHol').onclick = () => { const d = $('holDate').value; if (!d) return alert('日付を選んでください'); G.holidays.push({ date: d, note: $('holNote').value }); $('holDate').value = ''; $('holNote').value = ''; drawSet(); };
$('saveSet').onclick = busy($('saveSet'), async () => {
  const settings = {}; G.settings.forEach(s => settings[s.k] = s.v);
  await api('adminSave', { settings, models: G.models, holidays: G.holidays });
  alert('保存しました'); await loadSet();
});

if (pw) api('adminGet').then(enter).catch(() => { sessionStorage.removeItem('wash_admin_pw'); pw = ''; });
</script>
</body>
</html>
