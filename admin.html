<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14171b">
<title>洗車予約 管理</title>
<style>
:root{--ink:#171a1f;--sub:#5d6571;--line:#e3e6ea;--bg:#eef0f2;--paper:#fff;--gold:#c9a961;--amber:#f7a541;--red:#d4452d;--mute:#9aa1ab;--r:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
.top{background:#14171b;padding:calc(14px + env(safe-area-inset-top)) 20px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.top h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.16em;color:var(--gold)}
.top button{min-height:36px;padding:0 14px;border:1px solid #3a3f47;border-radius:99px;background:none;color:#c9ced6;font-size:13px}
.wrap{max-width:780px;margin:0 auto;min-height:calc(100vh - 60px);background:var(--paper);box-shadow:0 0 0 1px var(--line)}
.pane{padding:18px 20px 60px}
h3{margin:26px 0 6px;font-size:13px;font-weight:600;color:var(--sub);letter-spacing:.04em}
h3:first-child{margin-top:0}

.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto;background:#fff;position:sticky;top:0;z-index:3}
.tab{flex:none;min-height:52px;padding:0 16px;border:0;border-bottom:3px solid transparent;background:none;font-weight:600;color:var(--sub);white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}

label{display:block;margin:14px 0 5px;font-size:12.5px;font-weight:600;color:var(--sub)}
label .note{font-weight:400}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number]{width:100%;height:46px;padding:0 12px;border:1px solid #cfd4da;border-radius:var(--r);background:#fff;color:var(--ink);font:inherit;font-size:16px}
input:focus{border-color:var(--ink);outline:2px solid var(--ink);outline-offset:-1px}
.note{font-size:12.5px;color:var(--sub)}
.err{color:var(--red)}

.btn{min-height:46px;padding:0 20px;border:0;border-radius:var(--r);background:var(--ink);color:#fff;font-weight:600;letter-spacing:.04em}
.btn:disabled{background:#c9cdd3}
.btn.sub{background:#fff;color:var(--ink);border:1px solid #cfd4da}
.btn.sm{min-height:38px;padding:0 14px;font-size:13px}
.btn.danger{background:#fff;color:var(--red);border:1px solid #e4b8b0}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row>div{flex:1;min-width:130px}
.row>div.fit{flex:none;min-width:0}

.it{display:flex;gap:14px;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.it .t{font-weight:600;font-variant-numeric:tabular-nums}
.it .s{font-size:13px;color:var(--sub)}
.tag{display:inline-block;margin-left:6px;padding:0 8px;border-radius:99px;background:#f1f2f4;font-size:11.5px;font-weight:500;color:var(--sub);vertical-align:1px}
.tag.l{background:#14171b;color:var(--gold)}
.tag.w{background:#fde6c4;color:#8a4b00}

.mrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;margin-bottom:8px}
.chk{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:14px;margin:0;color:var(--ink);font-weight:500}
.chk input{width:20px;height:20px;accent-color:var(--ink)}
.savebar{position:sticky;bottom:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);margin:24px -20px -60px}
.savebar .btn{width:100%}
</style>
</head>
<body>
<header class="top"><h1>洗車予約 管理</h1><button id="logout" hidden>ログアウト</button></header>
<div class="wrap">

<div class="pane" id="login">
  <h3>管理者パスワード</h3>
  <input type="password" id="pw" autocomplete="current-password">
  <p><button class="btn" id="loginBtn" style="width:100%">ログイン</button></p>
  <p class="err" id="loginErr"></p>
</div>

<div id="app" hidden>
  <nav class="tabs">
    <button class="tab on" data-t="res">予約</button>
    <button class="tab" data-t="wait">キャンセル待ち</button>
    <button class="tab" data-t="set">設定</button>
  </nav>

  <div id="t-res" class="pane">
    <div class="row">
      <div><label for="from">から</label><input type="date" id="from"></div>
      <div><label for="to">まで</label><input type="date" id="to"></div>
      <div class="fit"><button class="btn" id="resGo">表示</button></div>
    </div>
    <div id="resList" style="margin-top:8px"></div>
  </div>

  <div id="t-wait" class="pane" hidden>
    <p class="note" style="margin-top:0">登録が早い順です。「通知中」は、空き枠を確保して案内メールを送った状態です(保留時間を過ぎると次の方へ)。</p>
    <div id="waitList"></div>
  </div>

  <div id="t-set" class="pane" hidden>
    <div id="setList"></div>
    <h3>車種</h3>
    <p class="note" style="margin:0 0 10px">「大型」にチェックした車種は、洗車時間が長くなります。</p>
    <div id="modelList"></div>
    <button class="btn sub sm" id="addModel">車種を追加</button>
    <h3>休業日(臨時休業など)</h3>
    <div id="holList"></div>
    <div class="row" style="margin-top:6px"><div><label for="holDate">日付</label><input type="date" id="holDate"></div><div><label for="holNote">メモ</label><input type="text" id="holNote"></div><div class="fit"><button class="btn sub" id="addHol">追加</button></div></div>
    <div class="savebar"><button class="btn" id="saveSet">設定を保存する</button></div>
  </div>
</div>
</div>

<script>
/* GASのウェブアプリURL */
const API = 'https://script.google.com/macros/s/AKfycbzHj9e15-2k4kkNa63ctM0P2KBXVbKfzGJGvhBNKXl0Er2u5_75qR7Kmev8Z0TzTdcg/exec';

const $ = id => document.getElementById(id);
const WD = ['日','月','火','水','木','金','土'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dJa = d => { const a = d.split('-'); return (+a[1]) + '/' + (+a[2]) + '(' + WD[new Date(+a[0], a[1]-1, +a[2]).getDay()] + ')'; };
let pw = sessionStorage.getItem('wash_admin_pw') || '', G = null;

async function api(action, data) {
  let r;
  try { r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, pw }, data || {})) }); }
  catch (e) { throw new Error('通信できませんでした'); }
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
function busy(btn, fn) { return async () => { btn.disabled = true; try { await fn(); } catch (e) { alert(e.message); } finally { btn.disabled = false; } }; }

async function enter() {
  $('login').hidden = true; $('app').hidden = false; $('logout').hidden = false;
  const t = new Date(), f = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  $('from').value = f(t); const e = new Date(t); e.setMonth(e.getMonth() + 3); $('to').value = f(e);
  await loadRes();
}
$('loginBtn').onclick = busy($('loginBtn'), async () => {
  pw = $('pw').value; $('loginErr').textContent = '';
  try { await api('adminGet'); sessionStorage.setItem('wash_admin_pw', pw); await enter(); }
  catch (e) { $('loginErr').textContent = e.message; pw = ''; }
});
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
$('logout').onclick = () => { sessionStorage.removeItem('wash_admin_pw'); location.reload(); };
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  ['res', 'wait', 'set'].forEach(k => $('t-' + k).hidden = k !== b.dataset.t);
  if (b.dataset.t === 'wait') loadWait().catch(e => alert(e.message));
  if (b.dataset.t === 'set') loadSet().catch(e => alert(e.message));
});

/* 予約 */
async function loadRes() {
  $('resList').innerHTML = '<p class="note">読み込み中…</p>';
  const list = await api('adminRes', { from: $('from').value, to: $('to').value });
  $('resList').innerHTML = list.length ? list.map(r => `<div class="it"><div><div class="t">${dJa(r.date)} ${r.start}〜${r.end}<span class="tag ${r.large ? 'l' : ''}">${r.large ? '大型' : '普通'}</span>${r.status === '保留' ? '<span class="tag w">案内中</span>' : ''}</div><div>${esc(r.name)} ・ ${esc(r.model)} ・ ${esc(r.plate)}</div><div class="s">${esc(r.phone)} ・ ${esc(r.email)} ・ No.${esc(r.no)}</div></div><button class="btn danger sm" data-c="${r.id}">取消</button></div>`).join('') : '<p class="note">この期間の予約はありません。</p>';
  $('resList').querySelectorAll('[data-c]').forEach(b => b.onclick = busy(b, async () => {
    if (!confirm('この予約を取り消しますか?\nお客様へキャンセルメールを送り、キャンセル待ちの方へ案内します。')) return;
    await api('adminCancel', { id: b.dataset.c }); await loadRes();
  }));
}
$('resGo').onclick = busy($('resGo'), loadRes);

/* キャンセル待ち */
async function loadWait() {
  $('waitList').innerHTML = '<p class="note">読み込み中…</p>';
  const list = await api('adminWaits');
  $('waitList').innerHTML = list.length ? list.map((w, i) => `<div class="it"><div><div class="t">${i + 1}. ${esc(w.name)} ・ ${esc(w.model)} ・ ${esc(w.plate)}${w.state === '通知中' ? '<span class="tag w">通知中</span>' : ''}</div><div>${esc(w.summary)}(対象${w.count}日)</div><div class="s">登録 ${esc(w.created)} ・ ${esc(w.phone)} ・ ${esc(w.email)}</div></div><button class="btn danger sm" data-w="${w.id}">削除</button></div>`).join('') : '<p class="note">キャンセル待ちはありません。</p>';
  $('waitList').querySelectorAll('[data-w]').forEach(b => b.onclick = busy(b, async () => {
    if (!confirm('このキャンセル待ちを削除しますか?')) return;
    await api('adminWaitStop', { id: b.dataset.w }); await loadWait();
  }));
}

/* 設定 */
async function loadSet() { G = await api('adminGet'); drawSet(); }
const GROUPS = [
  ['台数・時間', [['同時洗車台数', 'number'], ['開始', 'time'], ['最終開始(普通)', 'time'], ['最終開始(大型)', 'time'], ['昼休憩開始', 'time'], ['昼休憩終了', 'time'], ['洗車分(普通)', 'number'], ['洗車分(大型)', 'number'], ['刻み分', 'number']]],
  ['予約ルール', [['先行月数', 'number'], ['解禁時刻', 'time'], ['最短日数', 'number'], ['定休曜日', 'text'], ['保留時間(分)', 'number']]],
  ['表示・メール', [['店舗名', 'text'], ['サイトURL', 'text'], ['問い合わせ先', 'text']]]
];
const sv = k => G.settings.find(s => s.k === k);
const tv = v => { const m = String(v).match(/^(\d{1,2}):(\d{2})/); return m ? m[1].padStart(2, '0') + ':' + m[2] : ''; };
function drawSet() {
  $('setList').innerHTML = GROUPS.map(g => `<h3>${g[0]}</h3>` + g[1].map(f => {
    const s = sv(f[0]); if (!s) return '';
    const val = f[1] === 'time' ? tv(s.v) : s.v;
    return `<label for="k-${esc(f[0])}">${esc(f[0])}${s.d ? ' <span class="note">' + esc(s.d) + '</span>' : ''}</label><input id="k-${esc(f[0])}" type="${f[1]}" ${f[1] === 'number' ? 'inputmode="numeric" min="0"' : ''} data-k="${esc(f[0])}" value="${esc(val)}">`;
  }).join('')).join('');
  $('setList').querySelectorAll('[data-k]').forEach(e => e.oninput = () => { sv(e.dataset.k).v = e.value; });
  $('modelList').innerHTML = G.models.map((m, i) => `<div class="mrow"><input type="text" aria-label="車種名" data-mn="${i}" value="${esc(m.name)}"><label class="chk"><input type="checkbox" data-ml="${i}" ${m.large ? 'checked' : ''}>大型</label><button class="btn danger sm" data-md="${i}">削除</button></div>`).join('');
  $('holList').innerHTML = G.holidays.length ? G.holidays.map((h, i) => `<div class="it" style="padding:8px 0"><div>${esc(h.date)} <span class="s">${esc(h.note || '')}</span></div><button class="btn danger sm" data-hd="${i}">削除</button></div>`).join('') : '<p class="note" style="margin:0">登録はありません。</p>';
  $('modelList').querySelectorAll('[data-mn]').forEach(e => e.oninput = () => G.models[e.dataset.mn].name = e.value);
  $('modelList').querySelectorAll('[data-ml]').forEach(e => e.onchange = () => G.models[e.dataset.ml].large = e.checked);
  $('modelList').querySelectorAll('[data-md]').forEach(e => e.onclick = () => { G.models.splice(+e.dataset.md, 1); drawSet(); });
  $('holList').querySelectorAll('[data-hd]').forEach(e => e.onclick = () => { G.holidays.splice(+e.dataset.hd, 1); drawSet(); });
}
$('addModel').onclick = () => { G.models.push({ name: '', large: false }); drawSet(); };
$('addHol').onclick = () => { const d = $('holDate').value; if (!d) return alert('日付を選んでください'); G.holidays.push({ date: d, note: $('holNote').value }); $('holDate').value = ''; $('holNote').value = ''; drawSet(); };
$('saveSet').onclick = busy($('saveSet'), async () => {
  const settings = {}; G.settings.forEach(s => settings[s.k] = s.v);
  await api('adminSave', { settings, models: G.models, holidays: G.holidays });
  alert('保存しました'); await loadSet();
});

if (pw) api('adminGet').then(enter).catch(() => { sessionStorage.removeItem('wash_admin_pw'); pw = ''; });
</script>
</body>
</html>
