<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f5f4f1">
<title>洗車予約 管理</title>
<style>
:root{--ink:#1d1d1f;--sub:#6e6e73;--mute:#a1a1a6;--line:#e9e8e5;--bg:#f5f4f1;--card:#fff;--soft:#f2f1ee;--gold:#b8954a;--red:#c4412d;--r:10px;--rl:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;letter-spacing:.02em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;letter-spacing:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}

/* ヘッダー・タブ */
.head{position:sticky;top:0;z-index:5;background:rgba(245,244,241,.9);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);box-shadow:0 1px 0 var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:960px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 20px 8px}
.top h1{display:flex;align-items:center;gap:10px;margin:0;font-size:15px;font-weight:600;letter-spacing:.12em}
.top h1::before{content:"";width:5px;height:20px;border-radius:3px;background:linear-gradient(#d6b46a,#a8853d)}
.top h1 small{font-size:11.5px;font-weight:500;color:var(--sub);letter-spacing:.08em}
.top button{min-height:34px;padding:0 14px;border:0;border-radius:99px;background:none;color:var(--sub);font-size:13px}
.top button:hover{background:#ebe9e4;color:var(--ink)}
.tabs{display:flex;gap:2px;max-width:960px;margin:0 auto;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;min-height:46px;padding:0 14px;border:0;background:none;font-size:14px;font-weight:600;color:var(--sub);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;border-radius:2px;background:var(--ink)}
.tab .dot{display:inline-block;width:6px;height:6px;margin-left:6px;border-radius:50%;background:var(--red);vertical-align:3px}

.wrap{max-width:960px;margin:0 auto}
.pane{padding:22px 20px 80px}
h3{margin:0 0 4px;font-size:15px;font-weight:600;letter-spacing:.06em}
.card{background:var(--card);border-radius:var(--rl);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.03)}
.pad{padding:20px 20px 22px}
.stack>*+*{margin-top:16px}

/* フォーム */
label{display:block;margin:16px 0 6px;font-size:12.5px;font-weight:600;color:var(--sub);letter-spacing:.04em}
label .note{display:block;margin-top:1px;font-weight:400;font-size:11.5px;color:var(--mute)}
textarea{display:block;width:100%;min-height:88px;padding:11px 14px;border:0;border-radius:var(--r);background:var(--soft);color:var(--ink);font:inherit;font-size:15px;line-height:1.7;resize:vertical;transition:box-shadow .15s,background .15s}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number]{display:block;width:100%;height:44px;padding:0 14px;border:0;border-radius:var(--r);background:var(--soft);color:var(--ink);font:inherit;font-size:15px;transition:box-shadow .15s,background .15s}
textarea:focus,input:focus{background:#fff;box-shadow:0 0 0 1.5px var(--ink);outline:none}
.note{font-size:12.5px;line-height:1.75;color:var(--sub)}
.err{color:var(--red)}
.empty{padding:40px 0;text-align:center;color:var(--mute);font-size:14px}

.btn{min-height:44px;padding:0 20px;border:0;border-radius:99px;background:var(--ink);color:#fff;font-weight:600;letter-spacing:.06em;white-space:nowrap;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn:disabled{background:#d6d5d1;opacity:1}
.btn.sub{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sub:hover{background:var(--soft);opacity:1}
.btn.sm{min-height:34px;padding:0 14px;font-size:12.5px}
.btn.danger{background:none;color:var(--sub);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger:hover{background:#fbefec;color:var(--red);box-shadow:none;opacity:1}

/* ログイン */
#login{max-width:380px;margin:12vh auto 0;padding:32px 28px 28px}
@media (max-width:420px){#login{margin:8vh 16px 0}}
@media (max-width:560px){.it{align-items:flex-start;gap:12px;padding:14px 14px 14px 16px}.it .tm{width:48px}.it .num{margin-top:2px}}
#login h2{margin:0 0 4px;font-size:20px;font-weight:600;letter-spacing:.06em}
#login .btn{width:100%;margin-top:18px;min-height:48px}

/* 予約一覧 */
.tool{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding:6px 16px 16px}
.tool>div{flex:1;min-width:140px}
.tool>div.fit{flex:none;min-width:0}
.count{margin:22px 4px 0;font-size:12.5px;color:var(--sub)}
.day{margin-top:22px}
.day h4{display:flex;align-items:baseline;gap:10px;margin:0 4px 8px;font-size:14px;font-weight:600;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.day h4 span{font-size:12px;font-weight:500;color:var(--mute)}
.it{display:flex;gap:16px;align-items:center;padding:14px 16px 14px 18px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .tm{flex:none;width:58px;font-size:15px;font-weight:600;line-height:1.35;font-variant-numeric:tabular-nums}
.it .tm small{display:block;font-size:11.5px;font-weight:500;color:var(--mute)}
.it .num{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--soft);font-size:12.5px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums}
.it .bd{flex:1;min-width:0}
.it .t{font-weight:600}
.it .s{font-size:13px}
.it .s2{font-size:12px;color:var(--mute);overflow-wrap:anywhere}
.tag{display:inline-block;margin-left:8px;padding:0 8px;border-radius:99px;background:var(--soft);font-size:11px;font-weight:600;line-height:1.75;color:var(--sub);vertical-align:2px}
.tag.l{background:#f3ecdc;color:#8a6a2a}
.tag.w{background:#fdecd2;color:#9a5300}

/* 設定 */
.fields{display:grid;grid-template-columns:1fr;column-gap:16px}
.fields>div{display:flex;flex-direction:column;justify-content:flex-end}
@media (min-width:720px){.fields{grid-template-columns:1fr 1fr}.fields.three{grid-template-columns:1fr 1fr 1fr}}
.mrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;margin-bottom:8px}
.chk{display:flex;align-items:center;gap:7px;margin:0;white-space:nowrap;font-size:13.5px;font-weight:500;color:var(--ink)}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--ink)}
#modelList{margin-top:14px}

/* 休業日 */
.warn{display:flex;gap:10px;margin:0 0 14px;padding:12px 16px;border-radius:12px;background:#fdf1dd;color:#7a4a00;font-size:13px;line-height:1.7}
.warn::before{content:"!";flex:none;display:grid;place-items:center;width:18px;height:18px;margin-top:2px;border-radius:50%;background:#e0891c;color:#fff;font-size:11px;font-weight:700}
.hint{margin:0 4px 18px}
#holCal{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:820px){#holCal{grid-template-columns:1fr 1fr}}
.mon{padding:16px 16px 18px}
.mon-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 12px}
.mon-h b{font-size:16px;letter-spacing:.06em}
.st{display:inline-flex;align-items:center;gap:5px;margin-left:10px;font-size:12px;font-weight:600;vertical-align:1px}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.ok{color:#2f8f63}.st.no{color:#d47a12}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mcal .wd{height:30px;border:0;border-radius:8px;background:none;font-size:11.5px;font-weight:600;color:var(--mute)}
.mcal .wd:hover{background:var(--soft);color:var(--ink)}
.mcal .wd.sun{color:#c0503c}.mcal .wd.sat{color:#4a72b0}
.dd{height:40px;border:0;border-radius:9px;background:var(--soft);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;transition:background .12s,color .12s}
.dd:hover{background:#e7e5e0}
.dd.past{background:none;color:#cfcec9;font-weight:400}
.dd.cl{background:var(--ink);color:#fff}
.dd.cl.past{background:#d6d5d1;color:#fff}

.savebar{position:sticky;bottom:0;z-index:4;display:flex;justify-content:flex-end;margin:24px -20px -80px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:rgba(245,244,241,.9);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);box-shadow:0 -1px 0 var(--line)}
.savebar .btn{min-width:220px}
@media (max-width:560px){.savebar .btn{width:100%}}
</style>
</head>
<body>
<div class="head">
<header class="top"><h1>洗車予約 <small>管理</small></h1><button id="logout" hidden>ログアウト</button></header>
<nav class="tabs" id="tabs" hidden>
    <button class="tab on" data-t="res">予約</button>
    <button class="tab" data-t="wait">キャンセル待ち</button>
    <button class="tab" data-t="hol">休業日<i class="dot" id="holDot" hidden></i></button>
    <button class="tab" data-t="set">設定</button>
    <button class="tab" data-t="txt">画面の文章</button>
</nav>
</div>
<div class="wrap">

<div class="card" id="login">
  <h2>ログイン</h2>
  <label for="pw">管理者パスワード</label>
  <input type="password" id="pw" autocomplete="current-password">
  <button class="btn" id="loginBtn">ログイン</button>
  <p class="err" id="loginErr"></p>
</div>

<div id="app" hidden>

  <div id="t-res" class="pane">
    <div class="card tool">
      <div><label for="from">期間</label><input type="date" id="from"></div>
      <div><label for="to">〜</label><input type="date" id="to"></div>
      <div class="fit"><button class="btn" id="resGo">表示</button></div>
    </div>
    <div id="resList"></div>
  </div>

  <div id="t-wait" class="pane" hidden>
    <p class="note hint" style="margin-top:0">登録が早い順です。「通知中」は空き枠を確保して案内メールを送った状態で、保留時間を過ぎると次の方へ移ります。</p>
    <div id="waitList"></div>
  </div>

  <div id="t-set" class="pane" hidden>
    <div id="setList" class="stack"></div>
    <section class="card pad" style="margin-top:16px">
      <h3>車種</h3>
      <p class="note" style="margin:0">「大型」にチェックした車種は、洗車時間が長くなります。</p>
      <div id="modelList"></div>
      <button class="btn sub sm" id="addModel">+ 車種を追加</button>
    </section>
    <div class="savebar"><button class="btn" id="saveSet">設定を保存する</button></div>
  </div>

  <div id="t-hol" class="pane" hidden>
    <div class="warn" id="holWarn" hidden></div>
    <p class="note hint">日付をタップするとお休み/営業が切り替わります(自動保存)。曜日名をタップすると、その月の同じ曜日をまとめて切り替えます。お休みがない月も「この月を確定」を押してください。先1年ぶんまで設定でき、今月〜3か月先が未確定のあいだは毎日管理者メールにお知らせが届きます。</p>
    <div id="holCal"></div>
  </div>

  <div id="t-txt" class="pane" hidden>
    <p class="note hint" style="margin-top:0">お客様の画面に出る文章です。空にすると、その文章は表示されなくなります。</p>
    <div id="txtList" class="card pad" style="padding-top:4px"></div>
    <div class="savebar"><button class="btn" id="saveTxt">文章を保存する</button></div>
  </div>
</div>
</div>

<script>
/* GASのウェブアプリURL */
const API = 'https://script.google.com/macros/s/AKfycbzHj9e15-2k4kkNa63ctM0P2KBXVbKfzGJGvhBNKXl0Er2u5_75qR7Kmev8Z0TzTdcg/exec';

const $ = id => document.getElementById(id);
const WD = ['日','月','火','水','木','金','土'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dJa = d => { const a = d.split('-'); return (+a[1]) + '/' + (+a[2]) + '(' + WD[new Date(+a[0], a[1]-1, +a[2]).getDay()] + ')'; };
let pw = sessionStorage.getItem('wash_admin_pw') || '', G = null;

async function api(action, data) {
  let r;
  try { r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, pw }, data || {})) }); }
  catch (e) { throw new Error('通信できませんでした'); }
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
function busy(btn, fn) { return async () => { btn.disabled = true; try { await fn(); } catch (e) { alert(e.message); } finally { btn.disabled = false; } }; }

async function enter() {
  $('login').hidden = true; $('app').hidden = false; $('logout').hidden = false; $('tabs').hidden = false;
  const t = new Date(), f = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  $('from').value = f(t); const e = new Date(t); e.setMonth(e.getMonth() + 3); $('to').value = f(e);
  await loadRes();
  ensureG().then(dot).catch(() => {});
}
$('loginBtn').onclick = busy($('loginBtn'), async () => {
  pw = $('pw').value; $('loginErr').textContent = '';
  try { await api('adminGet'); sessionStorage.setItem('wash_admin_pw', pw); await enter(); }
  catch (e) { $('loginErr').textContent = e.message; pw = ''; }
});
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
$('logout').onclick = () => { sessionStorage.removeItem('wash_admin_pw'); location.reload(); };
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  ['res', 'wait', 'hol', 'set', 'txt'].forEach(k => $('t-' + k).hidden = k !== b.dataset.t);
  if (b.dataset.t === 'wait') loadWait().catch(e => alert(e.message));
  if (['hol', 'set', 'txt'].includes(b.dataset.t)) ensureG().then(drawAll).catch(e => alert(e.message));
});

/* 予約 */
async function loadRes() {
  $('resList').innerHTML = '<p class="empty">読み込み中…</p>';
  const list = await api('adminRes', { from: $('from').value, to: $('to').value });
  const byDay = {}; list.forEach(r => (byDay[r.date] = byDay[r.date] || []).push(r));
  $('resList').innerHTML = list.length ? `<p class="count">${list.length}件の予約</p>` + Object.keys(byDay).map(d => `<section class="day"><h4>${dJa(d)}<span>${byDay[d].length}件</span></h4><div class="card">` + byDay[d].map(r => `<div class="it"><div class="tm">${r.start}<small>〜${r.end}</small></div><div class="bd"><div class="t">${esc(r.name)}<span class="tag ${r.large ? 'l' : ''}">${r.large ? '大型' : '普通'}</span>${r.status === '保留' ? '<span class="tag w">案内中</span>' : ''}</div><div class="s">${esc(r.model)} ・ ${esc(r.plate)}</div><div class="s2">${esc(r.phone)} ・ ${esc(r.email)} ・ No.${esc(r.no)}</div></div><button class="btn danger sm" data-c="${r.id}">取消</button></div>`).join('') + '</div></section>').join('') : '<p class="empty">この期間の予約はありません。</p>';
  $('resList').querySelectorAll('[data-c]').forEach(b => b.onclick = busy(b, async () => {
    if (!confirm('この予約を取り消しますか?\nお客様へキャンセルメールを送り、キャンセル待ちの方へ案内します。')) return;
    await api('adminCancel', { id: b.dataset.c }); await loadRes();
  }));
}
$('resGo').onclick = busy($('resGo'), loadRes);

/* キャンセル待ち */
async function loadWait() {
  $('waitList').innerHTML = '<p class="empty">読み込み中…</p>';
  const list = await api('adminWaits');
  $('waitList').innerHTML = list.length ? '<div class="card">' + list.map((w, i) => `<div class="it"><div class="num">${i + 1}</div><div class="bd"><div class="t">${esc(w.name)}${w.state === '通知中' ? '<span class="tag w">通知中</span>' : ''}</div><div class="s">${esc(w.summary)}(対象${w.count}日)</div><div class="s2">${esc(w.model)} ・ ${esc(w.plate)} ・ ${esc(w.phone)} ・ ${esc(w.email)} ・ 登録 ${esc(w.created)}</div></div><button class="btn danger sm" data-w="${w.id}">削除</button></div>`).join('') + '</div>' : '<p class="empty">キャンセル待ちはありません。</p>';
  $('waitList').querySelectorAll('[data-w]').forEach(b => b.onclick = busy(b, async () => {
    if (!confirm('このキャンセル待ちを削除しますか?')) return;
    await api('adminWaitStop', { id: b.dataset.w }); await loadWait();
  }));
}

/* 設定・休業日・文章(同じデータ G を使う) */
let dirty = false;
async function ensureG() { if (!G) G = await api('adminGet'); return G; }
async function reloadG() { G = await api('adminGet'); dirty = false; drawAll(); }
const GROUPS = [
  ['台数・時間', [['同時洗車台数', 'number'], ['開始', 'time'], ['最終開始(普通)', 'time'], ['最終開始(大型)', 'time'], ['昼休憩開始', 'time'], ['昼休憩終了', 'time'], ['洗車分(普通)', 'number'], ['洗車分(大型)', 'number'], ['刻み分', 'number']]],
  ['予約ルール', [['先行月数', 'number'], ['解禁時刻', 'time'], ['最短日数', 'number'], ['保留時間(分)', 'number']]],
  ['表示・メール', [['店舗名', 'text'], ['サイトURL', 'text'], ['問い合わせ先', 'text'], ['管理者メール', 'text']]]
];
const sv = k => G.settings.find(s => s.k === k);
const tv = v => { const m = String(v).match(/^(\d{1,2}):(\d{2})/); return m ? m[1].padStart(2, '0') + ':' + m[2] : ''; };
const ymJa = ym => { const a = ym.split('-'); return a[0] + '年' + (+a[1]) + '月'; };
const pad = n => String(n).padStart(2, '0');
function drawAll() { if (!G) return; drawSet(); drawTxt(); drawHol(); dot(); }
function dot() { const n = G.need.filter(m => !G.confirmed.includes(m)).length; $('holDot').hidden = !n; }
function drawSet() {
  $('setList').innerHTML = GROUPS.map(g => `<section class="card pad"><h3>${g[0]}</h3><div class="fields${g[1].length > 6 ? ' three' : ''}">` + g[1].map(f => {
    const s = sv(f[0]); if (!s) return '';
    const val = f[1] === 'time' ? tv(s.v) : s.v;
    return `<div><label for="k-${esc(f[0])}">${esc(f[0])}${s.d ? ' <span class="note">' + esc(s.d) + '</span>' : ''}</label><input id="k-${esc(f[0])}" type="${f[1]}" ${f[1] === 'number' ? 'inputmode="numeric" min="0"' : ''} data-k="${esc(f[0])}" value="${esc(val)}"></div>`;
  }).join('') + '</div></section>').join('');
  $('setList').querySelectorAll('[data-k]').forEach(e => e.oninput = () => { sv(e.dataset.k).v = e.value; dirty = true; });
  $('modelList').innerHTML = G.models.map((m, i) => `<div class="mrow"><input type="text" aria-label="車種名" data-mn="${i}" value="${esc(m.name)}"><label class="chk"><input type="checkbox" data-ml="${i}" ${m.large ? 'checked' : ''}>大型</label><button class="btn danger sm" data-md="${i}">削除</button></div>`).join('');
  $('modelList').querySelectorAll('[data-mn]').forEach(e => e.oninput = () => { G.models[e.dataset.mn].name = e.value; dirty = true; });
  $('modelList').querySelectorAll('[data-ml]').forEach(e => e.onchange = () => { G.models[e.dataset.ml].large = e.checked; dirty = true; });
  $('modelList').querySelectorAll('[data-md]').forEach(e => e.onclick = () => { G.models.splice(+e.dataset.md, 1); dirty = true; drawSet(); });
}
$('addModel').onclick = () => { G.models.push({ name: '', large: false }); dirty = true; drawSet(); };

/* 画面の文章 */
const TXT_LABEL = { 'ヘッダー': '一番上(店名の下)', 'トップ見出し': 'トップ画面の見出し(洗車を予約する)', 'トップ': 'トップ画面の説明', '予約ボタン': 'トップ画面の予約ボタン', 'トップご案内': 'トップ画面の案内表', '洗車時間': '車種の下の洗車時間', 'お車の情報': 'お車の情報画面の注意書き', 'キャンセル待ち': 'キャンセル待ち画面の説明', '完了': '予約完了画面の注意書き' };
function drawTxt() {
  const rows = G.settings.filter(s => s.k.indexOf('文_') === 0);
  $('txtList').innerHTML = rows.map(s => { const n = s.k.slice(2); return `<label for="x-${esc(s.k)}">${esc(TXT_LABEL[n] || n)}${s.d ? '<span class="note">' + esc(s.d) + '</span>' : ''}</label><textarea id="x-${esc(s.k)}" data-x="${esc(s.k)}" ${n === 'トップご案内' ? 'style="min-height:150px"' : ''}>${esc(s.v)}</textarea>`; }).join('') +
    '<p class="note" style="margin:16px 0 0">案内表では {普通分} {大型分} {昼休憩} と書くと、現在の設定の数字に自動で入れ替わります。</p>';
  $('txtList').querySelectorAll('[data-x]').forEach(e => e.oninput = () => { sv(e.dataset.x).v = e.value; dirty = true; });
}

/* 休業日(ミニカレンダー) */
function drawHol() {
  const need = G.need, un = need.filter(m => !G.confirmed.includes(m));
  $('holWarn').hidden = !un.length;
  $('holWarn').textContent = un.length ? '未確定の月があります: ' + un.map(ymJa).join('、') + '。お休みを選んで「この月を確定」を押してください。' : '';
  const closed = new Set(G.holidays.map(h => h.date));
  $('holCal').innerHTML = (G.months || need).map(ym => {
    const a = ym.split('-').map(Number), first = new Date(a[0], a[1] - 1, 1).getDay(), last = new Date(a[0], a[1], 0).getDate(), ok = G.confirmed.includes(ym);
    let h = `<div class="card mon"><div class="mon-h"><div><b>${ymJa(ym)}</b><span class="st ${ok ? 'ok' : 'no'}">${ok ? '確定済み' : '未確定'}</span></div><button class="btn ${ok ? 'sub' : ''} sm" data-cf="${ym}">${ok ? '確定を取り消す' : 'この月を確定'}</button></div><div class="mcal">`;
    h += WD.map((w, i) => `<button class="wd ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}" data-wk="${ym}|${i}" title="${w}曜日をまとめて切り替え" aria-label="${ymJa(ym)}の${w}曜日をまとめて切り替え">${w}</button>`).join('');
    for (let i = 0; i < first; i++) h += '<div></div>';
    for (let d = 1; d <= last; d++) { const ds = ym + '-' + pad(d); h += `<button class="dd ${closed.has(ds) ? 'cl' : ''} ${ds < G.today ? 'past' : ''}" data-d="${ds}" aria-pressed="${closed.has(ds)}" aria-label="${ds}">${d}</button>`; }
    h += '</div></div>';
    return h;
  }).join('');
  $('holCal').querySelectorAll('[data-d]').forEach(b => b.onclick = () => { toggleDays([b.dataset.d]); });
  $('holCal').querySelectorAll('[data-wk]').forEach(b => b.onclick = () => {
    const [ym, w] = b.dataset.wk.split('|'), a = ym.split('-').map(Number), days = [];
    for (let d = 1; d <= new Date(a[0], a[1], 0).getDate(); d++) { const ds = ym + '-' + pad(d); if (ds >= G.today && new Date(a[0], a[1] - 1, d).getDay() === +w) days.push(ds); }
    toggleDays(days);
  });
  $('holCal').querySelectorAll('[data-cf]').forEach(b => b.onclick = busy(b, async () => {
    const ym = b.dataset.cf;
    G.confirmed = G.confirmed.includes(ym) ? G.confirmed.filter(m => m !== ym) : G.confirmed.concat(ym);
    await saveHol();
  }));
}
/** 指定した日を切り替える。全部休みなら営業に、そうでなければ全部休みにする */
function toggleDays(days) {
  const set = new Set(G.holidays.map(h => h.date)), allClosed = days.every(d => set.has(d));
  if (allClosed) G.holidays = G.holidays.filter(h => !days.includes(h.date));
  else days.forEach(d => { if (!set.has(d)) G.holidays.push({ date: d, note: '' }); });
  dirty = true; drawHol(); saveHolSoon();
}
/* 休業日はタップのたびに自動で保存する */
let ht;
function saveHolSoon() { clearTimeout(ht); ht = setTimeout(() => saveHol().catch(e => alert(e.message)), 700); }
async function saveHol() {
  clearTimeout(ht);
  await api('adminSave', { holidays: G.holidays, confirmed: G.confirmed });
  drawHol(); dot();
}

/* 設定・文章の保存 */
async function saveAll() {
  const settings = {}; G.settings.forEach(s => settings[s.k] = s.v);
  await api('adminSave', { settings, models: G.models, holidays: G.holidays, confirmed: G.confirmed });
  alert('保存しました'); await reloadG();
}
$('saveSet').onclick = busy($('saveSet'), saveAll);
$('saveTxt').onclick = busy($('saveTxt'), saveAll);

if (pw) api('adminGet').then(enter).catch(() => { sessionStorage.removeItem('wash_admin_pw'); pw = ''; });
</script>
